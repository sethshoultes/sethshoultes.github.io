name: Daily blog

# Single-shot daily pipeline: pick idea -> draft -> image -> validate -> commit/push.
# This workflow only consumes `secrets.*` — no untrusted github.event.* user input
# is interpolated into shell commands.
# On failure: opens an issue and sends an email via Resend. The script handles both —
# see scripts/daily_blog.py.

on:
  schedule:
    # 13:00 UTC = 09:00 ET (EDT). During EST (winter) this is 08:00 ET — accept the drift.
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      force_date:
        description: "Override target date (YYYY-MM-DD). Leave blank for today."
        required: false
        default: ""
      force_publish:
        description: "Bypass the 'bot already ran today' guard. Use for recovery / re-runs."
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  publish:
    name: Draft, validate, publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 50
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install anthropic openai requests

      - name: Configure git identity
        run: |
          git config user.name "daily-blog-bot"
          git config user.email "bot@users.noreply.github.com"

      # The curated idea source. Sparse-clone only the post-warehouse from the
      # private brain repo so the pipeline drafts from real, deduplicated ideas
      # instead of seeding on its own publish history (which caused the catalog
      # loop). Read-only: nothing is pushed back to brain. Degrades gracefully —
      # if the token is absent, the pipeline falls back to commit-seeded
      # generation (now guarded against repetition).
      - name: Fetch brain warehouse (idea source)
        env:
          BRAIN_REPO_TOKEN: ${{ secrets.BRAIN_REPO_TOKEN }}
        run: |
          set -e
          if [ -z "$BRAIN_REPO_TOKEN" ]; then
            echo "::warning::BRAIN_REPO_TOKEN not set — falling back to commit-seeded idea generation."
            exit 0
          fi
          git clone --depth 1 --filter=blob:none --sparse \
            "https://x-access-token:${BRAIN_REPO_TOKEN}@github.com/sethshoultes/brain.git" .brain
          git -C .brain sparse-checkout set post-warehouse
          echo "Warehouse candidates: $(ls .brain/post-warehouse/*.md | wc -l)"

      - name: Run daily blog pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: seth@caseproof.com
          NOTIFY_FROM: noreply@sethshoultes.com
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRAIN_DIR: ${{ github.workspace }}/.brain
          FORCE_DATE: ${{ inputs.force_date }}
          FORCE_PUBLISH: ${{ inputs.force_publish && '1' || '' }}
        run: |
          set -e
          if [ -z "$ANTHROPIC_API_KEY" ] || [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY or OPENAI_API_KEY repository secret is not set."
            exit 1
          fi
          python3 scripts/daily_blog.py
