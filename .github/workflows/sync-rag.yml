name: Sync new posts into Seth's Clone RAG

# Trigger whenever a post is added/changed on main, or manually via the Actions tab.
# This workflow only consumes `secrets.ELEVENLABS_API_KEY` — no untrusted user
# input from issues/PRs is interpolated into shell commands.
on:
  # Fire once the live site has the new posts, so URL ingestion never races a stale 404
  # (~/brain/learnings/github-pages-rebuild-race-breaks-post-publish-webhooks.md). sethshoultes.com is served by
  # Cloudflare Pages now (deploy-pages.yml), so that deploy finishing is the signal, not GitHub Pages' page_build
  # (sethshoultes.github.io#195).
  workflow_run:
    workflows: [Deploy to Cloudflare Pages]
    types: [completed]
    branches: [main]
  # Also fire on script-only pushes — script changes don't need Pages to rebuild.
  push:
    branches: [main]
    paths:
      - "scripts/add-post-to-rag.py"
  workflow_dispatch:

concurrency:
  group: sync-rag
  cancel-in-progress: false   # never cut an ingest short; a newer run queues behind it

jobs:
  sync:
    name: Add new blog URLs to ElevenLabs knowledge base
    # GitHub-hosted on purpose: this repo is public, and the job holds the ElevenLabs secret, so it must not run on our runner.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # After a deploy, only one that succeeded: a failed deploy leaves the old site live, so its new URLs would 404.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync RAG
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          if [ -z "$ELEVENLABS_API_KEY" ]; then
            echo "::error::ELEVENLABS_API_KEY repository secret is not set."
            echo "Add it at: Settings -> Secrets and variables -> Actions -> New repository secret"
            exit 1
          fi
          python3 scripts/add-post-to-rag.py
