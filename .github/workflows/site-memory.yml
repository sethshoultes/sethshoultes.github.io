# One memory line per merged pull request (site-kit#255). Vendored into the site by scripts/site_sync.py; do not edit by hand:
# CODEOWNERS makes the owner review every change to this file and to .sitekit/, and `verify` fails if they drift from kit.lock.
# The site agent writes a memory line for its own edits; a change merged any other way (a fleet pull request, a person's) left
# none. After a pull request merges into main, this adds `.agent/memory/<YYYY-MM>/<date>-<time>-<8 hex of the merge commit>.md`
# (read_brain reads only an 8-hex id) with one line (the date, who merged it and the title) through .sitekit/memory_line.py,
# and pushes it to main. A site turns it off with `"memory_lines": false` in .sitekit/features.json (a busy repo whose open
# pull requests must stay up to date with main).
# - It runs on the push a merge makes to main, never on the pull request's own event (sethshoultes/herdos#3870): a deploy
#   runner's gate passes only a push, schedule or dispatch on the default branch, and this job runs only main's code there.
#   It finds its pull request through the merge commit (commits/<sha>/pulls); a direct push with no pull request, or a merge
#   GitHub links to none, logs that and writes nothing.
# - Each merge has its own concurrency group: one shared group would cancel a waiting run when a third merge queued, and drop
#   that pull request's line. Each file name is unique, so runs never collide; a push that loses a race rebases and retries.
# - The title is untrusted: it reaches the script only through the environment, never this file's shell, and is cut to plain
#   words there.
# - A pull request that already adds a memory file (the site agent's own) gets no second line, and a site with no SOUL.md gets
#   none (memory_line.py says why).
# - A push main refuses (a protected branch, a ruleset) fails this job once, with an error annotation, and is never retried:
#   only a race with another push (a non-fast-forward) rebases and retries. The merge itself is already done and stays green.
#   Write access is granted to this one job only (the lead's conditions on #256).
# - It can't loop, and there is one deploy per merge (the fleet standard, the lead's ruling on #256): the memory line is pushed
#   with this workflow's own GITHUB_TOKEN, and a push made with that token starts no workflow, this one included. Its commit
#   message also STARTS with [skip ci]: GitHub Actions and Netlify read it anywhere, but a Cloudflare Pages git build only as a
#   prefix. Keep both: the memory line never reruns this workflow, the site's checks or its deploy.
name: site-memory
on:
  push:
    branches: [main]
permissions: {}
concurrency:
  group: site-memory-${{ github.sha }}
  cancel-in-progress: false
jobs:
  memory:
    # Never GitHub-hosted (sethshoultes/herdos#3868), and never a runner that also runs branch code: the repo variable
    # SITE_MEMORY_RUNS_ON (JSON) names the repo's deploy runner, which runs nothing but main. Unset, the job is skipped:
    # there is no fallback (eventpresser-dev-2 on site-kit#312).
    if: ${{ vars.SITE_MEMORY_RUNS_ON != '' }}
    runs-on: ${{ fromJSON(vars.SITE_MEMORY_RUNS_ON) }}
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      # On our own runner the workspace stays on disk between jobs, and that runner also runs pull requests' code: start empty,
      # .git included, so no hook or .git/config an earlier job left there runs next to the write token (sethshoultes/herdos#3868).
      - name: Start from an empty workspace
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          ref: main
          # The write token is never saved in .git/config: on our own runner the workspace stays on disk between jobs
          # (sethshoultes/herdos#3868). Only the push step below hands it to git, through its environment.
          persist-credentials: false
      - name: Find the merged pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          # The pull request merged into main whose merge (or squash, or last rebased) commit is this push's head.
          n=$(gh api "repos/$GITHUB_REPOSITORY/commits/$MERGE_SHA/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "main" and .merge_commit_sha == env.MERGE_SHA)][0].number // empty')
          if ! [[ "$n" =~ ^[0-9]+$ ]]; then
            echo "site-memory: no merged pull request for $MERGE_SHA (a direct push, or a merge GitHub links to none); nothing written."
            echo "number=" >>"$GITHUB_OUTPUT"; exit 0
          fi
          files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$n/files" --paginate --jq '.[].filename')
          if grep -q '^\.agent/memory/' <<<"$files"; then
            echo "site-memory: PR $n wrote its own memory; nothing more written."
            echo "number=" >>"$GITHUB_OUTPUT"; exit 0
          fi
          echo "number=$n" >>"$GITHUB_OUTPUT"
      - name: Write the memory line
        if: ${{ steps.pr.outputs.number != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          # Each value lands in a variable, never in a command line; memory_line.py checks every shape and cuts the title.
          read -r PR_MERGED_AT PR_MERGED_BY PR_MERGE_SHA < <(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            --jq '"\(.merged_at) \(.merged_by.login) \(.merge_commit_sha)"')
          PR_TITLE=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .title)
          export PR_TITLE PR_MERGED_AT PR_MERGED_BY PR_MERGE_SHA
          python3 -I .sitekit/memory_line.py
      - name: Push it to main
        if: ${{ steps.pr.outputs.number != '' }}
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # From the environment, which git ranks with -c above .git/config: the token header (github.com only, never argv or a file
          # left on the runner), and no hook or fsmonitor for any git call in this step, `git status` included.
          export GIT_CONFIG_COUNT=3 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_KEY_1=core.hooksPath GIT_CONFIG_VALUE_1=/dev/null GIT_CONFIG_KEY_2=core.fsmonitor GIT_CONFIG_VALUE_2=false
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GH_TOKEN:-}" | base64 | tr -d '\n')"; export GIT_CONFIG_VALUE_0
          [ -n "$(git status --porcelain -- .agent/memory)" ] || { echo "nothing to push"; exit 0; }
          git config user.name "site-memory"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .agent/memory
          git -c core.hooksPath=/dev/null commit -q -m "[skip ci] Memory: PR $PR_NUMBER (site-memory)"
          # Only a race (another push landed first: a non-fast-forward) is retried. Any other refusal, such as a protected main
          # or a ruleset, is reported once and fails this job without retrying; the merge itself is already done and green.
          for try in 1 2 3 4 5; do
            if out=$(git -c core.hooksPath=/dev/null push origin HEAD:main 2>&1); then echo "$out"; exit 0; fi
            echo "$out"
            if ! grep -qiE 'non-fast-forward|fetch first' <<<"$out"; then
              echo "::error title=site-memory::main refused the memory line for PR $PR_NUMBER (protected branch or ruleset?); no line written. The merge itself is fine."
              exit 1
            fi
            git -c core.hooksPath=/dev/null pull --rebase -q origin main
          done
          echo "::error title=site-memory::the memory line for PR $PR_NUMBER lost the push race 5 times; no line written."
          exit 1
