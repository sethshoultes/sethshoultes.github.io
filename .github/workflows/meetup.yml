name: Refresh meetup events

# Daily, and on demand. Reads the public Meetup group page; no secrets.
on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 scripts/fetch-meetup.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- _data/meetup.json; then
            echo "no change"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add _data/meetup.json
            git commit -m "Refresh meetup events"
            git push
          fi
