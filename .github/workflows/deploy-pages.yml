# Publishes sethshoultes.com on Cloudflare Pages (superintelligentfoo#256). GitHub Pages rebuilt the site on every push; Cloudflare
# does not, so this does: on a push to main, and by hand. Needs the repo secrets CLOUDFLARE_API_TOKEN (Pages edit) and CLOUDFLARE_ACCOUNT_ID.
# Cost (rule 9): about 2 minutes a run; pushes to main come to roughly 10 runs a day at most, 20 minutes.
name: Deploy to Cloudflare Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-pages
  cancel-in-progress: false   # never cut a deploy short; a newer run queues behind it and deploys the newer main
jobs:
  deploy:
    # GitHub-hosted on purpose: this repo is public, and the job holds the Cloudflare deploy token, so it must not run on our runner.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          ref: main
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697   # v1.0.13
        with:
          source: ./
          destination: ./_site
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4.4.0
        with:
          node-version: "22"
      # jekyll-build-pages runs in a root container, so _site comes out root-owned and the twins step can't write it (EACCES).
      - name: Own the built site
        run: sudo chown -R "$(id -u):$(id -g)" _site
      # Each SKILL.md has front matter, so Jekyll leaves them out (_config.yml); they are served as they are, so the digests in
      # .well-known/agent-skills/index.json match (herdos#3873).
      - name: Agent Skills, byte for byte
        run: cp -R .well-known/agent-skills/. _site/.well-known/agent-skills/
      - name: Markdown twins for agents
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node plugins/agent-files/scripts/twins.mjs _site --origin https://sethshoultes.com --skip-no-main
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.73.0 pages deploy _site --project-name foo-sethshoultes --branch main --commit-hash "$(git rev-parse HEAD)" --commit-message "deploy $(git rev-parse --short HEAD)"
