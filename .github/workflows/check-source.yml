name: Check source

# Fleet standard (herdos docs/standards/tests-and-ci.md, herdos#3429; this repo's issue is #195).
# Rule 1: a change runs only the areas of .github/test-map.json it touches; a path in no area fails by name.
# Rule 2: the full suite runs nightly and on demand, and on a PR or push only when a core file changed.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]   # a draft runs nothing: the jobs skip while draft
    paths-ignore: ["docs/**", "README.md"]
  push:
    branches: [main]
    paths-ignore: ["docs/**", "README.md"]
  schedule:
    - cron: "37 9 * * *"    # nightly full suite: once a day finds a regression by morning, at the cost of one 1.5-minute run
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-source-${{ github.event_name == 'schedule' && 'nightly' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Runner: ubuntu-latest on purpose. This repo is public, so GitHub-hosted minutes are free, and a public repo must not
# run fork PRs on our self-hosted runner. The site build needs GitHub's image (ruby/setup-ruby with a bundler cache).
jobs:
  check:
    # One job: pick the touched areas, then run each in turn. Each area takes 7-25s, so a runner per area (about
    # 10s to start, plus queue) cost more than it saved: #195's week of Nov 2-9 measured 98 min against 80 before.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # Pinned (2026-11-14): ubuntu-latest moved to 26.04, which has no prebuilt Ruby 3.1.3 (.ruby-version) for setup-ruby.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pick
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then base="HEAD~1"; fi
          git diff --name-only "$base" HEAD > "$RUNNER_TEMP/changed.txt" || : > "$RUNNER_TEMP/changed.txt"
          all=""
          case "${{ github.event_name }}" in schedule|workflow_dispatch) all="--all" ;; esac
          python3 .github/ci/test-map-select.py --map .github/test-map.json --changed "$RUNNER_TEMP/changed.txt" $all | tee -a "$GITHUB_OUTPUT"
          # a core change runs the full suite: every area (a later line in GITHUB_OUTPUT wins)
          if grep -q '^full=true' "$GITHUB_OUTPUT"; then
            python3 -c 'import json; print("areas=" + json.dumps(sorted(json.load(open(".github/test-map.json"))["areas"])))' >> "$GITHUB_OUTPUT"
          fi
      - uses: ruby/setup-ruby@v1
        if: contains(fromJSON(steps.pick.outputs.areas), 'site')
        with:
          bundler-cache: true
      - name: Run each touched area's tests
        if: steps.pick.outputs.areas != '[]'
        env:
          AREAS: ${{ steps.pick.outputs.areas }}
        run: |
          set -uo pipefail
          failed=""
          for area in $(python3 -c 'import json,os; print(" ".join(json.loads(os.environ["AREAS"])))'); do
            echo "::group::$area"
            cmd="$(AREA="$area" python3 -c 'import json,os; print(json.load(open(".github/test-map.json"))["areas"][os.environ["AREA"]]["run"])')"
            if bash -c "$cmd"; then echo "::endgroup::"; else echo "::endgroup::"; echo "::error::area $area failed"; failed="$failed $area"; fi
          done
          [ -z "$failed" ] || { echo "failed areas:$failed"; exit 1; }
