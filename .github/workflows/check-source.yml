name: Check source

on:
  pull_request:
  push:
    branches: [main]

jobs:
  inline-styles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No inline styles
        run: scripts/check-inline-styles.sh
  broken-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Build the site
        run: bundle exec jekyll build
      - name: No broken internal links
        run: node scripts/check-links.mjs _site
      - name: Embedded YouTube videos are available
        run: node scripts/check-youtube.mjs _site
      - name: Kit checks (inline styles, images in column, alt, link cards, schema, stylesheets, vendored kit lock)
        run: node assets/vendor/site-kit/check/kit-check.mjs _site
