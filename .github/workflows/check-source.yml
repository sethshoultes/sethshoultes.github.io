name: Check source

# Rules 3, 4 and 9 of the fleet standard (herdos docs/standards/tests-and-ci.md, herdos#3429; this repo's issue is #195).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]   # a draft runs nothing: the jobs skip while draft, ready_for_review starts them
    # Docs-only changes run nothing. Only docs/ and README.md: the other *.md files here (privacy, terms, a book page) are served pages.
    paths-ignore: ["docs/**", "README.md"]
  push:
    branches: [main]
    paths-ignore: ["docs/**", "README.md"]

permissions:
  contents: read

concurrency:
  group: check-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Runner: ubuntu-latest on purpose. This repo is public, so GitHub-hosted minutes are free, and a public repo must not
# run fork PRs on our self-hosted runner. The build needs GitHub's image (ruby/setup-ruby with a bundler cache).
jobs:
  inline-styles:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: No inline styles
        run: scripts/check-inline-styles.sh
  broken-links:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Build the site
        run: bundle exec jekyll build
      - name: No broken internal links
        run: node scripts/check-links.mjs _site
      - name: Embedded YouTube videos are available
        run: node scripts/check-youtube.mjs _site
      - name: Kit checks (inline styles, images in column, alt, link cards, schema, stylesheets, vendored kit lock)
        run: node assets/vendor/site-kit/check/kit-check.mjs _site
