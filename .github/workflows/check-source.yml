name: Check source

on:
  pull_request:
  push:
    branches: [main]

jobs:
  inline-styles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No inline styles
        run: scripts/check-inline-styles.sh
  broken-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Build the site
        run: bundle exec jekyll build
      - name: No broken internal links
        run: node scripts/check-links.mjs _site
