title: Seth Shoultes
description: AI consulting for small businesses, from a product leader with 25 years in WordPress.
why: "I build things that help a business grow and help people create, and I've been doing it for 25 years because I still love it."
url: https://sethshoultes.com

# Google Analytics 4 measurement ID (G-XXXXXXXX), loaded with gtag.js on every page.
# Leave empty and no tag loads.
ga4_id: "G-6WQ08C27LP"

# Preserve the existing /blog/<slug>.html URL shape so nothing breaks.
permalink: /blog/:slug:output_ext

# Date stamps in posts are 2026 — let future-dated posts publish.
future: true

# Markdown engine + highlighter (defaults; explicit for clarity).
markdown: kramdown
highlighter: rouge

# Files at the repo root that aren't Jekyll-relevant.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - CLAUDE.md
  - SOUL.md
  - canon
  - .gitignore
  - .ruby-version
  - scripts
  # site-kit plugins (scripts/plugin-sync.sh, plugins.lock): only a browser plugin's assets/ folder is served
  - plugins/agent-files
  - plugins/sitemap-check
  - plugins/*/README.md
  - plugins/*/plugin.json
  - plugins/*/plugin.py
  - plugins/*/tests
  - functions
  - plugins.lock
  - package.json
  - package-lock.json
  - node_modules
  - workers
  - tests
  - assets/vendor/site-kit/markup
  - assets/vendor/site-kit/check
  - assets/vendor/site-kit/scripts
  # Agent Skills (herdos#3873): a SKILL.md has front matter, so Jekyll would render it to SKILL.html. The repo copy is
  # discovery.py's source only; the served copy is put into _site after the build, byte for byte, so its sha256 holds.
  - skills/*/SKILL.md
  - .well-known/agent-skills/*/SKILL.md

# Jekyll skips dotfiles and dotted directories by default; force-include
# the .well-known directory so /.well-known/mcp.json is served at the
# canonical agent-discovery path.
include:
  - .well-known
  - _headers
  - _redirects

# GitHub Pages plugins — these are the safe defaults.
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-redirect-from

defaults:
  - scope:
      path: "lab"
    values:
      sitemap: false
  - scope:
      path: "admin"
    values:
      sitemap: false
  - scope:
      path: "docs"
    values:
      sitemap: false
  - scope:
      path: "data"
    values:
      sitemap: false
  - scope:
      path: "advanced-typing-games"
    values:
      sitemap: false
  - scope:
      path: "game-center"
    values:
      sitemap: false
  - scope:
      path: "garage-door-science-hub/CLAUDE.md"
    values:
      sitemap: false
  - scope:
      path: "wordpress-plugins"
    values:
      sitemap: false
  - scope:
      path: "build"
    values:
      sitemap: false
  - scope:
      path: "ops"
    values:
      sitemap: false
  - scope:
      path: ""
    values:
      image: /assets/og-default.png
  - scope:
      path: ""
      type: posts
    values:
      layout: post
