title: Seth Shoultes
description: AI consulting for small businesses, from a product leader with 25 years in WordPress.
url: https://sethshoultes.com

# Google Tag Manager container (GTM-XXXXXXX). Leave empty and no tag is loaded.
# GA4 is configured inside the container, so its measurement ID is not needed here.
gtm_id: ""
# GA4 measurement ID, loaded directly with gtag.js while there is no GTM container.
# Once gtm_id is set, configure GA4 inside the container and clear this.
ga4_id: "G-6WQ08C27LP"

# Preserve the existing /blog/<slug>.html URL shape so nothing breaks.
permalink: /blog/:slug:output_ext

# Date stamps in posts are 2026 — let future-dated posts publish.
future: true

# Markdown engine + highlighter (defaults; explicit for clarity).
markdown: kramdown
highlighter: rouge

# Files at the repo root that aren't Jekyll-relevant.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - .gitignore
  - .ruby-version
  - scripts
  - workers

# Jekyll skips dotfiles and dotted directories by default; force-include
# the .well-known directory so /.well-known/mcp.json is served at the
# canonical agent-discovery path.
include:
  - .well-known

# GitHub Pages plugins — these are the safe defaults.
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-redirect-from

defaults:
  - scope:
      path: "admin"
    values:
      sitemap: false
  - scope:
      path: "docs"
    values:
      sitemap: false
  - scope:
      path: "data"
    values:
      sitemap: false
  - scope:
      path: "advanced-typing-games"
    values:
      sitemap: false
  - scope:
      path: "game-center"
    values:
      sitemap: false
  - scope:
      path: "garage-door-science-hub/CLAUDE.md"
    values:
      sitemap: false
  - scope:
      path: "wordpress-plugins"
    values:
      sitemap: false
  - scope:
      path: "build"
    values:
      sitemap: false
  - scope:
      path: "ops"
    values:
      sitemap: false
  - scope:
      path: ""
    values:
      image: /assets/og-default.png
  - scope:
      path: ""
      type: posts
    values:
      layout: post
