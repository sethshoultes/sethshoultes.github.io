<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-label="Seconds until the main picture shows on a phone, heaviest page: WordPress 12.2, frozen copy 7.6, WordPress as editor 0.8, the rewrite 1.6"><rect width="720" height="250" fill="#fbf1e3"/><text x="10" y="18" font-size="14" fill="#6b4a3a">Seconds until the main picture shows, on a phone (median of 5 runs, lower is better)</text><g><text x="10" y="44" font-size="15" fill="#3a1f14">WordPress as it was</text><rect x="200" y="26" width="420" height="30" rx="4" fill="#9c3a20"/><text x="628" y="47" font-size="15" fill="#3a1f14">12.2 s</text></g><g><text x="10" y="98" font-size="15" fill="#3a1f14">Frozen copy</text><rect x="200" y="80" width="262" height="30" rx="4" fill="#c9744f"/><text x="470" y="101" font-size="15" fill="#3a1f14">7.6 s</text></g><g><text x="10" y="152" font-size="15" fill="#3a1f14">WordPress as editor</text><rect x="200" y="134" width="29" height="30" rx="4" fill="#c9744f"/><text x="237" y="155" font-size="15" fill="#3a1f14">0.8 s</text></g><g><text x="10" y="206" font-size="15" fill="#3a1f14">The rewrite</text><rect x="200" y="188" width="57" height="30" rx="4" fill="#3f6b4a"/><text x="265" y="209" font-size="15" fill="#3a1f14">1.6 s</text></g></svg>