{%- assign s = site.data.services[page.service] %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Service",
      "@id": "{{ site.url }}/{{ s.slug }}/#service",
      "name": {{ s.title | jsonify }},
      "serviceType": {{ s.service_type | jsonify }},
      "description": {{ s.description | jsonify }},
      "url": "{{ site.url }}/{{ s.slug }}/",
      "provider": { "@id": "{{ site.url }}/#person" },
      "areaServed": { "@type": "State", "name": "Utah" }
    },
    {
      "@type": "BreadcrumbList",
      "itemListElement": [
        { "@type": "ListItem", "position": 1, "name": "Home", "item": "{{ site.url }}/" },
        { "@type": "ListItem", "position": 2, "name": "Southern Utah", "item": "{{ site.url }}/southern-utah/" },
        { "@type": "ListItem", "position": 3, "name": {{ s.name | jsonify }}, "item": "{{ site.url }}/{{ s.slug }}/" }
      ]
    },
    {
      "@type": "FAQPage",
      "mainEntity": [
        {%- for item in s.faq %}
        { "@type": "Question", "name": {{ item.q | jsonify }}, "acceptedAnswer": { "@type": "Answer", "text": {{ item.a | jsonify }} } }{% unless forloop.last %},{% endunless %}
        {%- endfor %}
      ]
    }
  ]
}
</script>
