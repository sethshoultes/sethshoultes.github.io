<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Person",
      "@id": "{{ site.url }}/#person",
      "name": "Seth Shoultes",
      "url": "{{ site.url }}/",
      "image": "{{ site.url }}/assets/seth.jpg",
      "jobTitle": "AI consultant and product leader",
      "address": { "@type": "PostalAddress", "addressRegion": "UT", "addressCountry": "US" },
      "knowsAbout": ["AI consulting", "AI agents", "WordPress", "Product management", "SEO"],
      "description": "{{ site.description }}",
      "sameAs": [
        "https://www.linkedin.com/in/shoultes/",
        "https://github.com/sethshoultes"
      ]
    },
    {
      "@type": "ProfessionalService",
      "@id": "{{ site.url }}/#service",
      "name": "Seth Shoultes AI Consulting",
      "url": "{{ site.url }}/consulting/",
      "description": "Monthly AI consulting for small businesses: strategy, a fractional AI lead, or an AI agent team building for you.",
      "founder": { "@id": "{{ site.url }}/#person" },
      "areaServed": "US",
      "address": { "@type": "PostalAddress", "addressRegion": "UT", "addressCountry": "US" },
      "serviceType": ["AI consulting", "Fractional AI lead", "AI strategy workshops"]
    },
    {
      "@type": "FAQPage",
      "mainEntity": [
        {%- for item in site.data.faq %}
        { "@type": "Question", "name": {{ item.q | jsonify }}, "acceptedAnswer": { "@type": "Answer", "text": {{ item.a | jsonify }} } }{% unless forloop.last %},{% endunless %}
        {%- endfor %}
      ]
    }
  ]
}
</script>
