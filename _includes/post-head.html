  <title>{{ page.title }} — Seth Shoultes</title>
  <link rel="canonical" href="{{ page.url | absolute_url }}" />
  <meta name="description" content="{{ page.description | default: page.subtitle | escape }}" />

  <meta property="og:title" content="{{ page.og_title | default: page.title }}" />
  <meta property="og:description" content="{{ page.og_description | default: page.description | default: page.subtitle | escape }}" />
  <meta property="og:type" content="article" />
  <meta property="og:url" content="{{ site.url }}{{ page.url }}" />
  <meta name="twitter:card" content="summary_large_image" />
  {%- if page.og_image %}
  <meta property="og:image" content="{{ page.og_image }}" />
  <meta name="twitter:image" content="{{ page.og_image }}" />
  {%- endif %}
