  <title>{{ page.title }} — Seth Shoultes</title>
  <link rel="canonical" href="{{ page.url | absolute_url }}" />
  <meta name="description" content="{{ page.description | default: page.subtitle | escape }}" />

  <meta property="og:title" content="{{ page.og_title | default: page.title }}" />
  <meta property="og:description" content="{{ page.og_description | default: page.description | default: page.subtitle | escape }}" />
  <meta property="og:type" content="article" />
  <meta property="og:url" content="{{ site.url }}{{ page.url }}" />
  <meta name="twitter:card" content="summary_large_image" />
  {%- assign og_img = page.og_image | default: page.hero_image.src %}
  {%- if og_img %}
  <meta property="og:image" content="{{ og_img | absolute_url }}" />
  <meta name="twitter:image" content="{{ og_img | absolute_url }}" />
  {%- endif %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BlogPosting",
    "@id": "{{ site.url }}{{ page.url }}#post",
    "headline": {{ page.title | jsonify }},
    "description": {{ page.description | default: page.subtitle | jsonify }},
    "datePublished": "{{ page.date | date_to_xmlschema }}",
    "mainEntityOfPage": "{{ site.url }}{{ page.url }}",
    "author": { "@id": "{{ site.url }}/#person" }{% if page.hero_image %},
    "image": "{{ site.url }}{{ page.hero_image.src }}"{% endif %}
  }
  </script>
