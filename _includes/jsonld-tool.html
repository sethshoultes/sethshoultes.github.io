{%- assign t = site.data.tools | where: "slug", page.tool | first -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "WebApplication",
      "@id": "{{ site.url }}/tools/{{ t.slug }}/#app",
      "name": {{ t.name | jsonify }},
      "description": {{ t.description | jsonify }},
      "url": "{{ site.url }}/tools/{{ t.slug }}/",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Any",
      "browserRequirements": "Requires JavaScript",
      "isAccessibleForFree": true,
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
      "author": { "@id": "{{ site.url }}/#person" }
    },
    {
      "@type": "BreadcrumbList",
      "itemListElement": [
        { "@type": "ListItem", "position": 1, "name": "Home", "item": "{{ site.url }}/" },
        { "@type": "ListItem", "position": 2, "name": "Free tools", "item": "{{ site.url }}/tools/" },
        { "@type": "ListItem", "position": 3, "name": {{ t.name | jsonify }}, "item": "{{ site.url }}/tools/{{ t.slug }}/" }
      ]
    },
    {
      "@type": "FAQPage",
      "mainEntity": [
        {%- for item in t.faq %}
        { "@type": "Question", "name": {{ item.q | jsonify }}, "acceptedAnswer": { "@type": "Answer", "text": {{ item.a | jsonify }} } }{% unless forloop.last %},{% endunless %}
        {%- endfor %}
      ]
    }
  ]
}
</script>
