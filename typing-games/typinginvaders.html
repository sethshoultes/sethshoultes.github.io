<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Word Invaders</title>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a1a;
            font-family: Arial, sans-serif;
            color: #fff;
        }
        #gameContainer {
            position: relative;
            width: 800px;
            height: 600px;
        }
        #gameCanvas {
            border: 2px solid #333;
            background: #000;
        }
        #gameHUD {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 20px;
        }
        #currentWord {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            color: #fff;
        }
        /* arcade#322: the start card, so a round waits for the player instead of starting on page load. */
        #startCard { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(0, 0, 0, 0.6); z-index: 20; }
        #startCard[hidden] { display: none; }
        #startCard .panel { background: #111; color: #fff; border: 2px solid #44ff44; border-radius: 12px; padding: 20px; max-width: 360px; text-align: center; font-family: inherit; }
        #startCard h1 { margin: 0 0 12px; font-size: 24px; }
        #startCard .phone-line { display: none; }
        #startCard p { margin: 0 0 10px; line-height: 1.45; }
        #startCard button { margin-top: 6px; padding: 10px 26px; font-size: 18px; border: 0; border-radius: 999px; background: #44ff44; color: #111; font-weight: bold; cursor: pointer; }
        #gameOverModal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border: 2px solid #333;
            border-radius: 10px;
            text-align: center;
            animation: fadeIn 0.5s;
            z-index: 1000;
            min-width: 300px;
        }
        #gameOverModal h2 {
            color: #ff4444;
            margin-bottom: 20px;
        }
        #gameOverModal .stats {
            text-align: left;
            margin: 20px 0;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
        }
        #gameOverModal .high-scores {
            margin: 20px 0;
        }
        #gameOverModal .high-scores table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        #gameOverModal .high-scores td {
            padding: 5px;
            border-bottom: 1px solid #333;
        }
        #gameOverModal input {
            background: #333;
            border: 1px solid #555;
            color: #fff;
            padding: 5px 10px;
            margin: 10px 0;
            width: 200px;
            border-radius: 3px;
        }
        #gameOverModal button {
            background: #444;
            border: none;
            color: #fff;
            padding: 10px 20px;
            margin: 10px;
            cursor: pointer;
            border-radius: 5px;
            transition: background 0.3s;
        }
        #gameOverModal button:hover {
            background: #666;
        }
        .new-high-score {
            animation: pulse 1s infinite;
            color: #FFD700;
        }
        .touch-only {
            display: none;
        }
        /* sethshoultes.github.io#269: on a phone the 800x600 board scales to the screen's width, and a word box under
           it opens the on-screen keyboard (the game itself listens for key presses, which a phone never sends without
           a focused field). A mouse and a desktop window never match these. */
        @media (max-width: 820px) {
            body {
                align-items: flex-start;
                justify-content: flex-start;
                flex-direction: column;
            }
            #gameContainer {
                width: 100%;
                height: auto;
            }
            #gameCanvas {
                display: block;
                box-sizing: border-box;
                width: 100%;
                height: auto;
            }
            #gameHUD {
                font-size: 14px;
            }
        }
        @media (hover: none) and (pointer: coarse) {
            #startCard .keys-line { display: none; }
            #startCard .phone-line { display: inline; }
            .touch-only {
                display: block;
                box-sizing: border-box;
                width: 100%;
                margin: 8px 0 0;
                padding: 12px;
                font-size: 18px;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="gameHUD">
            Score: <span id="score">0</span> | 
            Lives: <span id="lives">♥♥♥</span> | 
            Level: <span id="level">1</span>
        </div>
        <div id="currentWord"></div>
    </div>
    <input type="text" id="touchType" class="touch-only" aria-label="Type the falling words" placeholder="Tap here to type"
        autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done">
    
    <div id="startCard">
        <div class="panel">
            <h1>Word Invaders</h1>
            <p>Words fall from the sky. Type each one before it lands. You have three lives.</p>
            <p>Every 1,000 points is a new level, and the words come faster.</p>
            <p class="how"><span class="keys-line">Just type the words.</span><span class="phone-line">Start opens the keyboard; type in the box under the game.</span></p>
            <button id="startButton">Start</button>
        </div>
    </div>

    <div id="gameOverModal">
        <h2>Game Over!</h2>
        <div class="stats"></div>
        <div id="nameInputContainer" style="display: none;">
            <p class="new-high-score">New High Score!</p>
            <input type="text" id="playerName" maxlength="15" placeholder="Enter your name">
        </div>
        <div class="high-scores"></div>
        <div>
            <button onclick="game.restart()">Try Again</button>
            <button onclick="game.showMainMenu()">Main Menu</button>
        </div>
    </div>
    <script>
        class HighScoreManager {
            constructor() {
                this.storageKey = 'wordInvadersHighScores';
                this.maxEntries = 10;
            }

            getScores() {
                const scores = localStorage.getItem(this.storageKey);
                return scores ? JSON.parse(scores) : [];
            }

            saveScore(scoreData) {
                let scores = this.getScores();
                scores.push(scoreData);
                scores.sort((a, b) => b.score - a.score);
                if (scores.length > this.maxEntries) {
                    scores = scores.slice(0, this.maxEntries);
                }
                localStorage.setItem(this.storageKey, JSON.stringify(scores));
            }

            isHighScore(score) {
                const scores = this.getScores();
                return scores.length < this.maxEntries || score > scores[scores.length - 1]?.score;
            }

            getTopScores(limit = 5) {
                return this.getScores().slice(0, limit);
            }
        }

        class PowerUp {
            constructor(type, x) {
                this.type = type;
                this.x = x;
                this.y = 0;
                this.speed = 2;
                this.size = 30;
                this.pulsePhase = 0;
            }

            update(deltaTime) {
                this.y += this.speed;
                this.pulsePhase = (this.pulsePhase + deltaTime / 500) % (2 * Math.PI);
            }

            draw(ctx) {
                const pulseScale = 0.2 * Math.sin(this.pulsePhase) + 1;
                const size = this.size * pulseScale;
                
                ctx.font = `${size}px Arial`;
                ctx.fillStyle = this.type.color;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.type.symbol, this.x, this.y);
            }
        }
        class Game {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.words = [];
                this.currentTyping = '';
                this.score = 0;
                this.lives = 3;
                this.level = 1;
                this.lastSpawn = 0;
                this.spawnInterval = 3000;
                this.baseSpeed = 1;
                
                // Game statistics
                this.wordsTyped = 0;
                this.powerUpsCollected = 0;
                this.totalKeystrokes = 0;
                this.accurateKeystrokes = 0;
                
                // High score system
                this.highScoreManager = new HighScoreManager();
                
                // Word pools by difficulty
                this.wordPools = {
                    1: ['the', 'cat', 'dog', 'run', 'eat', 'sleep', 'play', 'ball', 'red', 'blue', 'green', 'yellow','brown', 'white', 'black', 'css', 'php', 'mysql'],
                    2: ['quick', 'brown', 'pizza', 'happy', 'skill', 'learn', 'study', 'write', 'read', 'book', 'apple', 'orange', 'banana', 'grape', 'melon', 'water', 'drink', 'juice', 'milk', 'coffee', 'jump', 'html', 'java', 'python', 'ruby', 'csharp', 'javascript', 'react', 'angular', 'vue', 'svelte', 'jquery', 'bootstrap', 'tailwind', 'bulma', 'semantic', 'foundation', 'materialize', 'wordpress', 'joomla', 'drupal', 'magento', 'shopify', 'woocommerce', 'prestashop', 'opencart', 'bigcommerce', 'wix', 'squarespace', 'webflow', 'elementor', 'divi', 'beaver', 'brizy', 'gutenberg', 'visualcomposer', 'wpbakery', 'elementor', 'avada', 'enfold', 'divi', 'oceanwp', 'astra', 'generatepress', 'hello', 'flatsome', 'porto', 'woodmart', 'jupiter', 'salient', 'xtheme', 'themify', 'uncode', 'kallyas', 'bridge', 'betheme', 'impreza', 'soledad', 'newspaper', 'jannah', 'sahifa', 'flatsome', 'porto', 'woodmart', 'jupiter', 'salient', 'xtheme', 'themify', 'uncode', 'kallyas', 'bridge', 'betheme', 'impreza', 'soledad', 'newspaper', 'jannah', 'sahifa' ],
                    3: ['amazing', 'project', 'fantastic', 'computer', 'keyboard', 'monitor', 'internet', 'website', 'developer', 'programming', 'language', 'javascript', 'python', 'java', 'csharp', 'typescript', 'html', 'css', 'php', 'mysql', 'mongodb', 'nodejs', 'express', 'react', 'angular', 'vue', 'svelte', 'jquery', 'bootstrap', 'tailwind', 'bulma', 'semantic', 'foundation', 'materialize', 'wordpress', 'joomla', 'drupal', 'magento', 'shopify', 'woocommerce', 'prestashop', 'opencart', 'bigcommerce', 'wix', 'squarespace', 'webflow', 'elementor', 'divi', 'beaver', 'brizy', 'gutenberg', 'visualcomposer', 'wpbakery', 'elementor', 'avada', 'enfold', 'divi', 'oceanwp', 'astra', 'generatepress', 'hello', 'flatsome', 'porto', 'woodmart', 'jupiter', 'salient', 'xtheme', 'themify', 'uncode', 'kallyas', 'bridge', 'betheme', 'impreza', 'soledad', 'newspaper', 'jannah', 'sahifa', 'flatsome', 'porto', 'woodmart', 'jupiter', 'salient', 'xtheme', 'themify', 'uncode', 'kallyas', 'bridge', 'betheme', 'impreza', 'soledad', 'newspaper', 'jannah', 'sahifa']
                };

                // Power-up system
                this.powerUps = [];
                this.activePowerUps = new Set();
                this.lastPowerUpSpawn = 0;
                this.powerUpSpawnInterval = 15000;
                this.shieldActive = false;
                
                this.powerUpTypes = {
                    timeFreeze: {
                        symbol: '⏸️',
                        color: '#00ffff',
                        duration: 5000,
                        effect: () => {
                            this.frozenSpeeds = this.words.map(w => w.speed);
                            this.words.forEach(w => w.speed = 0);
                            setTimeout(() => {
                                if (this.frozenSpeeds) {
                                    this.words.forEach((w, i) => w.speed = this.frozenSpeeds[i]);
                                    this.frozenSpeeds = null;
                                    this.activePowerUps.delete('timeFreeze');
                                }
                            }, 5000);
                        }
                    },
                    wordClear: {
                        symbol: '💥',
                        color: '#ff4444',
                        duration: 0,
                        effect: () => {
                            this.words.forEach(w => this.score += w.text.length * 5);
                            this.words = [];
                        }
                    },
                    shield: {
                        symbol: '🛡️',
                        color: '#44ff44',
                        duration: 10000,
                        effect: () => {
                            this.shieldActive = true;
                            setTimeout(() => {
                                this.shieldActive = false;
                                this.activePowerUps.delete('shield');
                            }, 10000);
                        }
                    }
                };

                // Bind event listeners
                // sethshoultes.github.io#269: a phone types into #touchType, whose letters reach the same handler; its
                // own key presses are skipped here, so a phone with a keyboard attached does not count each letter twice.
                const touchType = document.getElementById('touchType');
                document.addEventListener('keydown', (e) => { if (e.target !== touchType) this.handleKeyPress(e); });
                touchType.addEventListener('input', () => {
                    for (const key of touchType.value.toLowerCase()) this.handleKeyPress({ key });
                    touchType.value = '';
                });
                this.canvas.addEventListener('click', (e) => { if (e.pointerType !== 'mouse') touchType.focus(); });

                // Initialize HUD
                this.updateHUD();
                
                // Start game loop
                this.lastTime = performance.now();
                requestAnimationFrame(this.gameLoop.bind(this));
            }
            handleKeyPress(event) {
                if (event.key.length === 1) { // Only handle single character keys
                    this.totalKeystrokes++;
                    this.currentTyping += event.key;
                    
                    // Check if current typing matches any active words
                    const matchingWord = this.words.find(word => 
                        word.text.startsWith(this.currentTyping));

                    if (!matchingWord) {
                        // Reset if no matching word
                        this.currentTyping = '';
                    } else if (matchingWord.text === this.currentTyping) {
                        // Update statistics
                        this.wordsTyped++;
                        this.accurateKeystrokes += this.currentTyping.length;
                        
                        // Word completed
                        this.words = this.words.filter(w => w !== matchingWord);
                        this.score += matchingWord.text.length * 10;
                        this.updateHUD();
                        this.currentTyping = '';
                    }

                    document.getElementById('currentWord').textContent = this.currentTyping;
                }
            }

            spawnWord() {
                const pool = this.wordPools[Math.min(this.level, 3)];
                const word = {
                    text: pool[Math.floor(Math.random() * pool.length)],
                    x: Math.random() * (this.canvas.width - 100),
                    y: 0,
                    speed: this.baseSpeed * (1 + this.level * 0.1)
                };
                this.words.push(word);
            }

            spawnPowerUp() {
                const types = Object.entries(this.powerUpTypes);
                const [typeId, type] = types[Math.floor(Math.random() * types.length)];
                const x = Math.random() * (this.canvas.width - 50) + 25;
                this.powerUps.push(new PowerUp(
                    { ...type, id: typeId },
                    x
                ));
            }

            checkPowerUpCollision(x, y) {
                const collisionRadius = 20;
                return this.powerUps.findIndex(powerUp => {
                    const dx = powerUp.x - x;
                    const dy = powerUp.y - y;
                    return Math.sqrt(dx * dx + dy * dy) < collisionRadius;
                });
            }

            updateHUD() {
                document.getElementById('score').textContent = this.score;
                document.getElementById('lives').textContent = '♥'.repeat(this.lives);
                document.getElementById('level').textContent = this.level;
            }

            updateActivePowerUps() {
                let status = '';
                for (const powerUpId of this.activePowerUps) {
                    const type = this.powerUpTypes[powerUpId];
                    if (type) {
                        status += type.symbol + ' ';
                    }
                }
                const statusElem = document.getElementById('powerUpStatus');
                if (!statusElem) {
                    const hud = document.getElementById('gameHUD');
                    const span = document.createElement('span');
                    span.id = 'powerUpStatus';
                    hud.appendChild(span);
                }
                // the label only while a power-up is on, so a fresh round's HUD reads as the first one did
                document.getElementById('powerUpStatus').textContent = status ? ` | Active: ${status}` : '';
            }
            gameLoop(timestamp) {
                const deltaTime = timestamp - this.lastTime;
                this.lastTime = timestamp;

                // Clear canvas
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                // Spawn new words
                if (timestamp - this.lastSpawn > this.spawnInterval) {
                    this.spawnWord();
                    this.lastSpawn = timestamp;
                }

                // Update and draw words
                this.ctx.font = '24px Arial';
                this.ctx.fillStyle = '#fff';

                for (let i = this.words.length - 1; i >= 0; i--) {
                    const word = this.words[i];
                    word.y += word.speed;

                    // Check if word reached bottom
                    if (word.y > this.canvas.height && !this.shieldActive) {
                        this.words.splice(i, 1);
                        this.lives--;
                        this.updateHUD();
                        
                        if (this.lives <= 0) {
                            this.showGameOver();
                            return;
                        }
                        continue;
                    }

                    // Draw word
                    this.ctx.fillStyle = word.text.startsWith(this.currentTyping) ? '#00ff00' : '#fff';
                    this.ctx.fillText(word.text, word.x, word.y);
                }

                // Update and draw power-ups
                for (let i = this.powerUps.length - 1; i >= 0; i--) {
                    const powerUp = this.powerUps[i];
                    powerUp.update(deltaTime);
                    
                    // Remove if reached bottom
                    if (powerUp.y > this.canvas.height) {
                        this.powerUps.splice(i, 1);
                        continue;
                    }
                    
                    // Check for collection with current typing position
                    if (this.currentTyping) {
                        const lastWord = this.words.find(w => w.text.startsWith(this.currentTyping));
                        if (lastWord) {
                            const wordX = lastWord.x + this.ctx.measureText(this.currentTyping).width / 2;
                            const wordY = lastWord.y;
                            
                            if (this.checkPowerUpCollision(wordX, wordY) === i) {
                                // Collect power-up
                                this.powerUps.splice(i, 1);
                                this.activePowerUps.add(powerUp.type.id);
                                powerUp.type.effect();
                                this.powerUpsCollected++;
                                continue;
                            }
                        }
                    }
                    
                    powerUp.draw(this.ctx);
                }

                // Spawn new power-ups
                if (timestamp - this.lastPowerUpSpawn > this.powerUpSpawnInterval) {
                    if (Math.random() < 0.3) { // 30% chance to spawn
                        this.spawnPowerUp();
                    }
                    this.lastPowerUpSpawn = timestamp;
                }

                this.updateActivePowerUps();

                // Level progression
                if (this.score > this.level * 1000) {
                    this.level++;
                    this.spawnInterval = Math.max(1000, this.spawnInterval - 200);
                    this.updateHUD();
                }

                requestAnimationFrame(this.gameLoop.bind(this));
            }
            showGameOver() {
                const modal = document.getElementById('gameOverModal');
                const statsDiv = modal.querySelector('.stats');
                const accuracy = this.totalKeystrokes > 0 
                    ? Math.round((this.accurateKeystrokes / this.totalKeystrokes) * 100) 
                    : 0;

                statsDiv.innerHTML = `
                    <p>Final Score: ${this.score}</p>
                    <p>Level Reached: ${this.level}</p>
                    <p>Words Destroyed: ${this.wordsTyped}</p>
                    <p>Accuracy Rate: ${accuracy}%</p>
                    <p>Power-ups Used: ${this.powerUpsCollected}</p>
                `;

                const isHighScore = this.highScoreManager.isHighScore(this.score);
                const nameInput = document.getElementById('nameInputContainer');
                nameInput.style.display = isHighScore ? 'block' : 'none';

                if (isHighScore) {
                    const input = document.getElementById('playerName');
                    input.value = '';
                    input.onkeypress = (e) => {
                        if (e.key === 'Enter' && input.value.trim()) {
                            this.saveHighScore(input.value.trim());
                        }
                    };
                }

                this.updateHighScoreDisplay();
                modal.style.display = 'block';
            }

            saveHighScore(playerName) {
                const scoreData = {
                    name: playerName,
                    score: this.score,
                    level: this.level,
                    date: new Date().toLocaleDateString(),
                    wordsTyped: this.wordsTyped
                };
                this.highScoreManager.saveScore(scoreData);
                this.updateHighScoreDisplay();
                document.getElementById('nameInputContainer').style.display = 'none';
            }

            updateHighScoreDisplay() {
                const highScoresDiv = document.querySelector('.high-scores');
                const scores = this.highScoreManager.getTopScores();
                
                let html = '<h3>High Scores</h3><table>';
                scores.forEach((score, index) => {
                    html += `
                        <tr>
                            <td>${index + 1}.</td>
                            <td>${score.name}</td>
                            <td>${score.score}</td>
                            <td>Level ${score.level}</td>
                            <td>${score.date}</td>
                        </tr>
                    `;
                });
                html += '</table>';
                highScoresDiv.innerHTML = html;
            }

            reset() {
                this.words = [];
                this.currentTyping = '';
                this.score = 0;
                this.lives = 3;
                this.level = 1;
                this.lastSpawn = 0;
                this.spawnInterval = 3000;
                this.wordsTyped = 0;
                this.powerUpsCollected = 0;
                this.totalKeystrokes = 0;
                this.accurateKeystrokes = 0;
                this.powerUps = [];
                this.activePowerUps.clear();
                this.shieldActive = false;
                this.updateHUD();
                document.getElementById('currentWord').textContent = '';
            }

            restart() {
                document.getElementById('gameOverModal').style.display = 'none';
                this.reset();
                // sethshoultes.github.io#275: game over returns from gameLoop without another frame, so the loop is
                // stopped here; start it again. The modal's buttons are the only callers, shown only once it stopped.
                this.lastTime = performance.now();
                requestAnimationFrame(this.gameLoop.bind(this));
            }

            // arcade#322: Main Menu goes back to the start card; its Start begins the next round.
            showMainMenu() {
                document.getElementById('gameOverModal').style.display = 'none';
                this.reset(); // the card shows over an empty board: no old score, lives or half-typed word behind it
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                document.getElementById('startCard').hidden = false;
                document.getElementById('startButton').focus(); // Enter or Space starts the next round, no Tab first
            }
        }

        // arcade#322: the round starts from the start card's Start, never on page load. The first Start makes the game; a
        // later one (after Main Menu) restarts it. sethshoultes.github.io#275: the game-over buttons call game.restart().
        document.getElementById('startButton').addEventListener('click', () => {
            document.getElementById('startCard').hidden = true;
            if (window.game) window.game.restart(); else window.game = new Game();
            if (matchMedia('(pointer: coarse)').matches) document.getElementById('touchType').focus(); // the tap opens the phone's keyboard
        });
        document.getElementById('startButton').focus(); // on a keyboard, Enter or Space starts the round
    </script>
</body>
</html>
