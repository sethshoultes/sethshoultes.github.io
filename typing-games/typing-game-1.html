<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Typing Star Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { overflow: hidden; }
        /* sethshoultes.github.io#270: on a touch screen the star follows a finger, so the canvas must not scroll or
           zoom, and the word box sits near the top, above the on-screen keyboard. A mouse never matches. */
        @media (hover: none) and (pointer: coarse) {
            #gameCanvas { touch-action: none; }
            #wordInput { top: 96px; }
        }
        .star {
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
        }
    </style>
</head>
<body class="bg-blue-900">
    <div class="fixed top-4 right-4 text-white font-bold text-xl z-10">
        Score: <span id="score">0</span>
        <br>
        Time: <span id="timer">0.00</span>s
    </div>
    
    <div id="wordInput" class="fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 hidden">
        <input type="text" class="bg-white/80 rounded px-4 py-2 text-blue-900 text-center" autocomplete="off">
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const timerElement = document.getElementById('timer');
        const wordInput = document.getElementById('wordInput');
        const input = wordInput.querySelector('input');

        // Set canvas size
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Game state
        let score = 0;
        let currentWord = null;
        let typingStartTime = 0;
        
        // Player state
        const player = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            size: 30,
            speed: 5,
            moving: {
                w: false, a: false, s: false, d: false
            }
        };

        // Words data
        const aiWords = {
            models: ['GPT', 'BERT', 'DALL-E', 'LLM', 'RNN', 'CNN'],
            concepts: ['Neural', 'Data', 'Learn', 'AI', 'ML', 'AGI'],
            companies: ['OpenAI', 'Google', 'Meta', 'IBM'],
            programming: ['Python', 'Model', 'Train', 'Code']
        };

        // Floating words
        const words = [];
        class FloatingWord {
            constructor() {
                const category = Object.keys(aiWords)[Math.floor(Math.random() * Object.keys(aiWords).length)];
                const wordList = aiWords[category];
                this.text = wordList[Math.floor(Math.random() * wordList.length)];
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.speed = 1;
                this.angle = Math.random() * Math.PI * 2;
            }

            move() {
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;

                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;
            }

            draw() {
                ctx.font = '20px Arial';
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.fillText(this.text, this.x, this.y);
            }
        }

        // Initialize words
        for (let i = 0; i < 10; i++) {
            words.push(new FloatingWord());
        }

        // Movement controls
        document.addEventListener('keydown', (e) => {
            if (!currentWord) {
                if (e.key.toLowerCase() in player.moving) {
                    player.moving[e.key.toLowerCase()] = true;
                }
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.key.toLowerCase() in player.moving) {
                player.moving[e.key.toLowerCase()] = false;
            }
        });

        // sethshoultes.github.io#270: a finger on the canvas steers the star toward it. Lifting it is a user gesture, so
        // focusing the word box there opens the phone's keyboard (the focus from the game loop does not). A mouse is
        // ignored, so desktop plays with WASD as before.
        let touchTarget = null, touchPlay = false;
        const steer = (e) => {
            if (e.pointerType === 'mouse') return;
            e.preventDefault();
            touchPlay = true;
            touchTarget = { x: e.clientX, y: e.clientY };
        };
        const release = (e) => {
            if (e.pointerType === 'mouse') return;
            touchTarget = null;
            if (currentWord) input.focus();
        };
        canvas.addEventListener('pointerdown', steer);
        canvas.addEventListener('pointermove', (e) => { if (touchTarget) steer(e); });
        canvas.addEventListener('pointerup', release);
        canvas.addEventListener('pointercancel', release);

        // Word typing
        input.addEventListener('input', () => {
            if (currentWord && input.value.toLowerCase() === currentWord.text.toLowerCase()) {
                const timeElapsed = (Date.now() - typingStartTime) / 1000;
                const pointsEarned = Math.max(1, Math.floor(10 / timeElapsed));
                score += pointsEarned;
                scoreElement.textContent = score;
                
                words.splice(words.indexOf(currentWord), 1);
                words.push(new FloatingWord());
                
                currentWord = null;
                wordInput.style.display = 'none';
                input.value = '';
            }
        });

        // Draw star
        function drawStar(x, y, size) {
            ctx.save();
            ctx.translate(x, y);
            ctx.beginPath();
            ctx.fillStyle = 'white';
            ctx.moveTo(0, -size);
            for (let i = 0; i < 5; i++) {
                ctx.rotate(Math.PI / 5);
                ctx.lineTo(0, -size * 0.4);
                ctx.rotate(Math.PI / 5);
                ctx.lineTo(0, -size);
            }
            ctx.fill();
            ctx.restore();
        }

        // Collision detection
        function checkCollision(word) {
            const dx = word.x - player.x;
            const dy = word.y - player.y;
            return Math.sqrt(dx * dx + dy * dy) < player.size;
        }

        // Game loop
        function gameLoop() {
            // Clear canvas
            ctx.fillStyle = '#1e3a8a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Move player
            if (!currentWord) {
                if (player.moving.w) player.y -= player.speed;
                if (player.moving.s) player.y += player.speed;
                if (player.moving.a) player.x -= player.speed;
                if (player.moving.d) player.x += player.speed;
                if (touchTarget) {
                    const dx = touchTarget.x - player.x;
                    const dy = touchTarget.y - player.y;
                    const dist = Math.hypot(dx, dy);
                    if (dist > player.speed) {
                        player.x += (dx / dist) * player.speed;
                        player.y += (dy / dist) * player.speed;
                    }
                }

                // Keep player in bounds
                player.x = Math.max(player.size, Math.min(canvas.width - player.size, player.x));
                player.y = Math.max(player.size, Math.min(canvas.height - player.size, player.y));
            }

            // Draw and move words
            words.forEach(word => {
                word.move();
                word.draw();

                if (!currentWord && checkCollision(word)) {
                    currentWord = word;
                    wordInput.style.display = 'block';
                    if (touchPlay) input.placeholder = currentWord.text; // the word itself may be under the keyboard
                    input.focus();
                    typingStartTime = Date.now();
                }
            });

            // Draw player
            drawStar(player.x, player.y, player.size);

            // Update timer if typing
            if (currentWord) {
                timerElement.textContent = ((Date.now() - typingStartTime) / 1000).toFixed(2);
            }

            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
