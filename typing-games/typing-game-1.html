<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Typing Star Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { overflow: hidden; }
        /* sethshoultes.github.io#270: on a touch screen the star follows a finger, so the canvas must not scroll or
           zoom, and the word box sits near the top, above the on-screen keyboard. A mouse never matches. */
        @media (hover: none) and (pointer: coarse) {
            #gameCanvas { touch-action: none; }
            #wordInput { top: 124px; } /* below the scoreboard's pill, which reaches y 80 (designer on #283) */
        }
        .star {
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
        }
    </style>
</head>
<body class="bg-blue-900">
    <div class="fixed top-4 right-4 text-white font-bold text-xl z-10 bg-blue-950 tabular-nums rounded-lg px-3 py-1">
        Score: <span id="score">0</span> · Words: <span id="caught">0</span> <span class="opacity-75 font-normal">(goal 20)</span>
        <br>
        Time left: <span id="timer">60</span>s
    </div>
    
    <div id="wordInput" class="fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 hidden">
        <input type="text" class="bg-white rounded px-4 py-2 text-blue-900 text-center" autocomplete="off">
    </div>

    <canvas id="gameCanvas"></canvas>

    <!-- arcade#320: a round with a goal and an end: 60 s to type 20 words. -->
    <div id="card" class="fixed inset-0 flex items-center justify-center z-20 p-4 bg-blue-950/60">
        <div class="bg-white text-blue-900 rounded-2xl p-6 max-w-sm w-full text-center shadow-xl">
            <h1 id="cardTitle" class="text-2xl font-bold mb-2">AI Typing Star</h1>
            <p id="cardText" class="mb-4">Fly the star into a word, then type it. Type 20 words in 60 seconds. The faster you type each one, the more points it's worth.</p>
            <p id="cardHow" class="text-sm mb-4 opacity-80">Move: W A S D on a keyboard, or drag your finger on a phone.</p>
            <button id="cardButton" class="bg-blue-700 hover:bg-blue-800 text-white font-bold rounded-full px-6 py-3">Start</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const timerElement = document.getElementById('timer');
        const caughtElement = document.getElementById('caught');
        const card = document.getElementById('card'), cardTitle = document.getElementById('cardTitle'), cardText = document.getElementById('cardText');
        const cardHow = document.getElementById('cardHow'), cardButton = document.getElementById('cardButton');
        const wordInput = document.getElementById('wordInput');
        const input = wordInput.querySelector('input');

        // Set canvas size
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Game state
        let score = 0;
        let currentWord = null;
        let typingStartTime = 0;
        // The round (arcade#320): ready until Start, then 60 s, then over with the score and Play again.
        // goal 20: the designer's bot, at a human pace, typed 34 to 43 in 60 s, so 10 was passed in about 15 s (#283).
        const ROUND = { seconds: 60, goal: 20 };
        let state = 'ready', roundStart = 0, caught = 0, best = 0;
        try { best = Number(localStorage.getItem('ai-typing-star-best')) || 0; } catch { /* no storage: this visit only */ }
        function startRound() {
            score = 0; caught = 0; currentWord = null; input.value = ''; wordInput.style.display = 'none';
            scoreElement.textContent = '0'; caughtElement.textContent = '0'; timerElement.textContent = String(ROUND.seconds);
            card.style.display = 'none'; state = 'playing'; roundStart = Date.now();
        }
        function endRound() {
            state = 'over'; currentWord = null; wordInput.style.display = 'none'; input.blur();
            const newBest = score > best;
            if (newBest) { best = score; try { localStorage.setItem('ai-typing-star-best', String(best)); } catch { /* not kept */ } }
            cardTitle.textContent = caught >= ROUND.goal ? 'You made it!' : 'Time!';
            cardText.textContent = `${caught} words (goal: ${ROUND.goal}), ${score} points.${caught >= ROUND.goal ? '' : ` ${ROUND.goal - caught} more to reach it next time.`}`;
            cardHow.textContent = newBest ? 'A new best!' : `Your best: ${best} points.`;
            cardButton.textContent = 'Play again';
            card.style.display = 'flex';
            cardButton.focus(); // Enter or Space plays again, no mouse needed
        }
        cardButton.addEventListener('click', startRound);
        cardButton.focus(); // on a keyboard, Enter or Space starts the round
        
        // Player state
        const player = {
            x: canvas.width / 2,
            y: canvas.height * 0.75, // below the centred start card, so a new player sees the star the card talks about
            size: 30,
            speed: 5,
            moving: {
                w: false, a: false, s: false, d: false
            }
        };

        // Words data
        const aiWords = {
            models: ['GPT', 'BERT', 'GAN', 'LLM', 'RNN', 'CNN'],
            concepts: ['Neural', 'Data', 'Learn', 'AI', 'ML', 'AGI'],
            space: ['Orbit', 'Comet', 'Nova', 'Rocket'], // arcade#320: our own words, never a real company's name
            programming: ['Python', 'Model', 'Train', 'Code']
        };

        // Floating words
        const words = [];
        class FloatingWord {
            constructor() {
                const category = Object.keys(aiWords)[Math.floor(Math.random() * Object.keys(aiWords).length)];
                const wordList = aiWords[category];
                this.text = wordList[Math.floor(Math.random() * wordList.length)];
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.speed = 1;
                this.angle = Math.random() * Math.PI * 2;
            }

            move() {
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;

                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;
            }

            draw() {
                ctx.font = '20px Arial';
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.fillText(this.text, this.x, this.y);
            }
        }

        // Initialize words
        for (let i = 0; i < 10; i++) {
            words.push(new FloatingWord());
        }

        // Movement controls
        document.addEventListener('keydown', (e) => {
            if (state === 'playing' && !currentWord) {
                if (e.key.toLowerCase() in player.moving) {
                    player.moving[e.key.toLowerCase()] = true;
                }
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.key.toLowerCase() in player.moving) {
                player.moving[e.key.toLowerCase()] = false;
            }
        });

        // sethshoultes.github.io#270: a finger on the canvas steers the star toward it. Lifting it is a user gesture, so
        // focusing the word box there opens the phone's keyboard (the focus from the game loop does not). A mouse is
        // ignored, so desktop plays with WASD as before.
        let touchTarget = null;
        const steer = (e) => {
            if (e.pointerType === 'mouse') return;
            e.preventDefault();
            touchTarget = { x: e.clientX, y: e.clientY };
        };
        const release = (e) => {
            if (e.pointerType === 'mouse') return;
            touchTarget = null;
            if (currentWord) input.focus();
        };
        canvas.addEventListener('pointerdown', steer);
        canvas.addEventListener('pointermove', (e) => { if (touchTarget) steer(e); });
        canvas.addEventListener('pointerup', release);
        canvas.addEventListener('pointercancel', release);

        // Word typing
        input.addEventListener('input', () => {
            if (currentWord && input.value.toLowerCase() === currentWord.text.toLowerCase()) {
                const timeElapsed = (Date.now() - typingStartTime) / 1000;
                const pointsEarned = Math.max(1, Math.floor(10 / timeElapsed));
                score += pointsEarned;
                scoreElement.textContent = score;
                caught++;
                caughtElement.textContent = caught;
                
                words.splice(words.indexOf(currentWord), 1);
                words.push(new FloatingWord());
                
                currentWord = null;
                wordInput.style.display = 'none';
                input.value = '';
            }
        });

        // Draw star
        function drawStar(x, y, size) {
            ctx.save();
            ctx.translate(x, y);
            ctx.beginPath();
            ctx.fillStyle = 'white';
            ctx.moveTo(0, -size);
            for (let i = 0; i < 5; i++) {
                ctx.rotate(Math.PI / 5);
                ctx.lineTo(0, -size * 0.4);
                ctx.rotate(Math.PI / 5);
                ctx.lineTo(0, -size);
            }
            ctx.fill();
            ctx.restore();
        }

        // Collision detection
        function checkCollision(word) {
            const dx = word.x - player.x;
            const dy = word.y - player.y;
            return Math.sqrt(dx * dx + dy * dy) < player.size;
        }

        // Game loop
        function gameLoop() {
            // Clear canvas
            ctx.fillStyle = '#1e3a8a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // The round's clock
            if (state === 'playing') {
                const left = Math.max(0, ROUND.seconds - (Date.now() - roundStart) / 1000);
                timerElement.textContent = String(Math.ceil(left));
                if (left === 0) endRound();
            }

            // Move player
            if (state === 'playing' && !currentWord) {
                if (player.moving.w) player.y -= player.speed;
                if (player.moving.s) player.y += player.speed;
                if (player.moving.a) player.x -= player.speed;
                if (player.moving.d) player.x += player.speed;
                if (touchTarget) {
                    const dx = touchTarget.x - player.x;
                    const dy = touchTarget.y - player.y;
                    const dist = Math.hypot(dx, dy);
                    if (dist > player.speed) {
                        player.x += (dx / dist) * player.speed;
                        player.y += (dy / dist) * player.speed;
                    }
                }

                // Keep player in bounds
                player.x = Math.max(player.size, Math.min(canvas.width - player.size, player.x));
                player.y = Math.max(player.size, Math.min(canvas.height - player.size, player.y));
            }

            // Draw and move words
            words.forEach(word => {
                word.move();
                word.draw();

                if (state === 'playing' && !currentWord && checkCollision(word)) {
                    currentWord = word;
                    wordInput.style.display = 'block';
                    input.placeholder = currentWord.text; // the word, in the box: under a phone's keyboard, or far from the box on a desktop
                    input.focus();
                    typingStartTime = Date.now();
                }
            });

            // Draw player
            drawStar(player.x, player.y, player.size);

            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
