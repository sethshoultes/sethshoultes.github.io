- slug: ai-time-saved-calculator
  order: 7
  name: "AI time-saved calculator"
  title: "Free AI Time-Saved Calculator: Hours and Dollars Back"
  description: "Free AI time-saved calculator. List the tasks you do each week, say how much time AI could save on each, and see the hours and dollars you get back. Runs in your browser."
  summary: "List your weekly tasks, say how much time AI could save on each, and see the hours and dollars you would get back."
  lead: "List the tasks that fill your week and how much of each you think AI could take over. You see the hours and dollars you would get back each week and each year."
  sections:
    - id: what
      heading: "What this does"
      paragraphs:
        - "You enter your own tasks, how often you do them, how long they take and how much of that time you think AI could save. The tool does the math. It has no numbers of its own, so the answer is only as good as your estimates."
        - "It runs in your browser. What you type never leaves this page."
    - id: how
      heading: "How to use it"
      paragraphs:
        - "**1. Add your tasks.** Think of the things you do over and over: answering emails, writing quotes, posting to social media, writing up job notes."
        - "**2. Be honest about the savings.** AI rarely does a whole task. If it would cut a task in half, enter 50. A smaller number you believe beats a big one you do not."
        - "**3. Set what your time is worth.** Use what you pay someone to do the work, or what you would earn spending that hour on customers."
        - "**4. Pick the biggest line first.** The task with the most hours saved is where to start."
    - id: why
      heading: "What to do with the answer"
      paragraphs:
        - "Start with one task, not all of them. Get it working, then take the next. If you want help choosing and setting up the first one, [book a call](/consulting/#contact)."
  faq:
    - q: "Is this really free?"
      a: "Yes. There is no sign-up and nothing to pay."
    - q: "Does my information leave my browser?"
      a: "No. The math runs on this page and nothing is sent to a server."
    - q: "How much time will AI really save me?"
      a: "It depends on the task, and I cannot tell you from here. That is why you enter the percentage yourself. Try one task for a week and use what you actually saw."
    - q: "What hourly value should I use?"
      a: "Use what you pay someone to do the work, or what an hour of your time is worth when you spend it on customers. If you are unsure, use a low number."
    - q: "Why does it ask for weeks per year?"
      a: "To turn a weekly saving into a yearly one. Take out the weeks you are closed or away."
    - q: "Can you help me set up the tasks that save the most?"
      a: "Yes. Book a call, bring your list, and we will pick the first one together."
- slug: personal-ai-profile-builder
  order: 8
  name: "Personal AI profile builder"
  title: "Free Personal AI Profile Builder for ChatGPT, Claude, Gemini and Perplexity"
  description: "Free personal AI profile builder. Pick your tone, detail and humor, copy a ready-made profile, and paste it into ChatGPT, Claude, Gemini or Perplexity so every answer sounds right. Runs in your browser."
  summary: "Pick your tone, detail and humor, copy the profile, and paste it into ChatGPT, Claude, Gemini or Perplexity so every answer sounds like it was written for you."
  lead: "Tell the AI once how you like to be answered. Pick your tone, how much detail and how much humor, copy the profile, and paste it into ChatGPT, Claude, Gemini or Perplexity."
  sections:
    - id: what
      heading: "What this does"
      paragraphs:
        - "AI assistants start every chat knowing nothing about you. A short profile fixes that: who you are, how you like answers and what to avoid. This tool writes it from a few choices."
        - "It runs in your browser. What you type never leaves this page, and the profile contains only what you pick."
    - id: how
      heading: "How to use it"
      paragraphs:
        - "**1. Make your choices.** Say who you are and pick the tone, detail and humor you like."
        - "**2. Copy the profile.**"
        - "**3. Paste it where your assistant keeps your preferences.** Open the tab for your assistant above. Menu names change from time to time, so look for personalization, custom instructions or preferences."
        - "**4. Try a question.** If the answer is off, change one choice and paste it again."
    - id: why
      heading: "Why it helps"
      paragraphs:
        - "You stop retyping \"keep it short\" and \"no jargon\" in every chat. The same profile works across assistants, so you sound the same wherever you ask."
        - "If you want help setting AI up across your business, [book a call](/consulting/#contact)."
  faq:
    - q: "Is this really free?"
      a: "Yes. There is no sign-up and nothing to pay."
    - q: "Does my information leave my browser?"
      a: "No. The profile is built on this page and nothing is sent to a server."
    - q: "Is it safe to put my name and job in a profile?"
      a: "The profile goes to the assistant you paste it into, under that company's privacy terms. Leave out anything you would not type into a chat, such as passwords or client names."
    - q: "Will the assistant always follow it?"
      a: "Mostly, but not every time. If an answer ignores your profile, say so in the chat and it will usually correct itself."
    - q: "Where do I paste it in each assistant?"
      a: "The tabs above the profile list the place for ChatGPT, Claude, Gemini and Perplexity. Menu names change, so look for personalization, custom instructions or preferences."
    - q: "Can I use the same profile in more than one assistant?"
      a: "Yes. Paste the same text into each one."
- slug: ai-crawler-access-check
  order: 2
  name: "AI crawler access check"
  title: "Free AI Crawler Access Check: Can ChatGPT, Claude and Perplexity Read Your Site?"
  description: "Free AI crawler access check. Enter your website and see whether GPTBot, ClaudeBot, PerplexityBot and Google-Extended are allowed in, and whether you have llms.txt, a markdown version and JSON-LD."
  summary: "Enter your website and see whether ChatGPT, Claude, Perplexity and Google's AI crawlers are allowed in, and whether you have llms.txt, a markdown version and JSON-LD."
  lead: "AI assistants can only recommend what they can read. Enter your website and see which AI crawlers your robots.txt lets in, and whether you have the files that help them understand you."
  sections:
    - id: what
      heading: "What this checks"
      paragraphs:
        - "**robots.txt.** Whether GPTBot (OpenAI), ClaudeBot (Anthropic), PerplexityBot and Google-Extended are allowed to read your site, blocked from all of it, or blocked from some paths."
        - "**llms.txt.** A plain file at the top of your site that tells AI assistants what you do and where to look."
        - "**A markdown version.** A clean text copy of your page that is easy for AI to read."
        - "**JSON-LD.** The code that spells out your business details in a form machines understand."
        - "The tool reads your public pages the way a crawler would. It only reports what it finds, and when it cannot tell, it says so."
    - id: how
      heading: "How to read the result"
      paragraphs:
        - "**Open** means the crawler may read your whole site. **Partly open** means it may read your pages but some paths are closed, which is usually fine for admin areas. **Blocked** means your robots.txt tells that crawler to stay out of everything."
        - "If a crawler is blocked and you want to be recommended by that assistant, ask whoever manages your site to remove or change that rule."
        - "Google-Extended is the switch for Gemini. Blocking it does not remove you from Google Search."
    - id: why
      heading: "Why it matters"
      paragraphs:
        - "Some hosts and security plugins block AI crawlers by default, and the site owner never finds out. If the crawler cannot read you, the assistant has nothing to say about you."
        - "If you want me to fix what this finds, [book a call](/consulting/#contact)."
  faq:
    - q: "Is this really free?"
      a: "Yes. There is no sign-up and nothing to pay. To stop abuse, each visitor gets a limited number of checks an hour."
    - q: "What does the tool fetch from my site?"
      a: "Your robots.txt, your llms.txt, your home page, and a possible markdown copy of it, once each, the way a crawler would. It does not log in or change anything."
    - q: "Do you keep my website address?"
      a: "No. The address is used for the check and is not saved."
    - q: "Does allowed mean ChatGPT will recommend me?"
      a: "No. It means the door is open. Whether an assistant names you depends on what it can find and trust about your business."
    - q: "My robots.txt allows everything but a crawler shows as blocked. Why?"
      a: "The check follows the robots.txt rules the way crawlers do: a rule written for one crawler by name replaces the general rules for that crawler. Read the rule shown under the result."
    - q: "A check says it could not read something. What now?"
      a: "The site may have blocked the tool, been slow, or been down. Try again in a few minutes, or book a call and I will look at it by hand."
    - q: "Is there a WordPress plugin that does this automatically?"
      a: "Yes, CrawlPress, my plugin. It checks every day, shows which AI crawlers visit your site and writes your llms.txt."
- slug: llms-txt-generator
  order: 3
  name: "llms.txt generator"
  title: "Free llms.txt Generator: Build the File AI Assistants Read"
  description: "Free llms.txt generator. Enter your website and get a ready-to-upload llms.txt built from your own sitemap, with each page's real title and description."
  summary: "Enter your website and get a ready-to-upload llms.txt built from your own sitemap, using each page's real title and description."
  lead: "An llms.txt file tells AI assistants what your site is about and which pages matter. Enter your website and get one built from your own sitemap, ready to upload."
  sections:
    - id: what
      heading: "What this does"
      paragraphs:
        - "The tool finds your sitemap, picks your main pages, reads each page's title and description, and writes them into the llms.txt format: your site name, a one-line summary, and a list of links."
        - "Everything in the file comes from your own pages. If a page cannot be read, it is left out, and the tool tells you how many. If your home page has no description, the summary line is left out rather than invented."
    - id: how
      heading: "How to use it"
      paragraphs:
        - "**1. Enter your website.** The tool needs a sitemap, usually at /sitemap.xml."
        - "**2. Read the result.** It lists up to 20 pages, the ones closest to your home page first. Remove any you do not want and fix any title that reads badly."
        - "**3. Upload it.** Save the text as llms.txt and put it at the top of your site, so it opens at yoursite.com/llms.txt. On WordPress, your host's file manager or an SFTP client will do."
        - "**4. Check it.** Open the address in your browser, then run the [AI crawler access check](/tools/ai-crawler-access-check/) to see that crawlers can reach it."
    - id: why
      heading: "Why it matters"
      paragraphs:
        - "AI assistants cannot read every page of your site every time someone asks. llms.txt is a short map that points them to what you want them to know. It is a proposal that many sites now follow, not a guarantee that any assistant uses it."
        - "If you want me to write and maintain it with you, [book a call](/consulting/#contact)."
  faq:
    - q: "What is llms.txt?"
      a: "A plain text file at the top of your site, written in a simple format, that gives AI assistants a short summary of your site and links to your key pages."
    - q: "Is this really free?"
      a: "Yes. There is no sign-up and nothing to pay. To stop abuse, each visitor gets a few runs an hour."
    - q: "Do you keep my website address or the file?"
      a: "No. The address is used to build the file and is not saved."
    - q: "Why only 20 pages?"
      a: "A short, clear list works better than a long one. The tool picks the pages closest to your home page. You can add more by hand."
    - q: "It says it could not find a sitemap. What now?"
      a: "The tool looks in your robots.txt and at /sitemap.xml. Add a sitemap, which most WordPress SEO plugins can create, then try again."
    - q: "Will an AI assistant use my llms.txt?"
      a: "Some may, some do not yet. It costs nothing and it keeps your own description of your site in plain view."
    - q: "Is there a WordPress plugin that does this automatically?"
      a: "Yes, CrawlPress, my plugin. It writes your llms.txt and keeps it current."
