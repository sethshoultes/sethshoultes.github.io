- slug: ai-crawler-access-check
  order: 2
  name: "AI crawler access check"
  title: "Free AI Crawler Access Check: Can ChatGPT, Claude and Perplexity Read Your Site?"
  description: "Free AI crawler access check. Enter your website and see whether GPTBot, ClaudeBot, PerplexityBot and Google-Extended are allowed in, and whether you have llms.txt, a markdown version and JSON-LD."
  summary: "Enter your website and see whether ChatGPT, Claude, Perplexity and Google's AI crawlers are allowed in, and whether you have llms.txt, a markdown version and JSON-LD."
  lead: "AI assistants can only recommend what they can read. Enter your website and see which AI crawlers your robots.txt lets in, and whether you have the files that help them understand you."
  sections:
    - id: what
      heading: "What this checks"
      paragraphs:
        - "**robots.txt.** Whether GPTBot (OpenAI), ClaudeBot (Anthropic), PerplexityBot and Google-Extended are allowed to read your site, blocked from all of it, or blocked from some paths."
        - "**llms.txt.** A plain file at the top of your site that tells AI assistants what you do and where to look."
        - "**A markdown version.** A clean text copy of your page that is easy for AI to read."
        - "**JSON-LD.** The code that spells out your business details in a form machines understand."
        - "The tool reads your public pages the way a crawler would. It only reports what it finds, and when it cannot tell, it says so."
    - id: how
      heading: "How to read the result"
      paragraphs:
        - "**Open** means the crawler may read your whole site. **Partly open** means it may read your pages but some paths are closed, which is usually fine for admin areas. **Blocked** means your robots.txt tells that crawler to stay out of everything."
        - "If a crawler is blocked and you want to be recommended by that assistant, ask whoever manages your site to remove or change that rule."
        - "Google-Extended is the switch for Gemini. Blocking it does not remove you from Google Search."
    - id: why
      heading: "Why it matters"
      paragraphs:
        - "Some hosts and security plugins block AI crawlers by default, and the site owner never finds out. If the crawler cannot read you, the assistant has nothing to say about you."
        - "If you want me to fix what this finds, [book a call](/consulting/#contact)."
  faq:
    - q: "Is this really free?"
      a: "Yes. There is no sign-up and nothing to pay. To stop abuse, each visitor gets a limited number of checks an hour."
    - q: "What does the tool fetch from my site?"
      a: "Your robots.txt, your llms.txt, your home page, and a possible markdown copy of it, once each, the way a crawler would. It does not log in or change anything."
    - q: "Do you keep my website address?"
      a: "No. The address is used for the check and is not saved."
    - q: "Does allowed mean ChatGPT will recommend me?"
      a: "No. It means the door is open. Whether an assistant names you depends on what it can find and trust about your business."
    - q: "My robots.txt allows everything but a crawler shows as blocked. Why?"
      a: "The check follows the robots.txt rules the way crawlers do: a rule written for one crawler by name replaces the general rules for that crawler. Read the rule shown under the result."
    - q: "A check says it could not read something. What now?"
      a: "The site may have blocked the tool, been slow, or been down. Try again in a few minutes, or book a call and I will look at it by hand."
    - q: "Is there a WordPress plugin that does this automatically?"
      a: "Yes, CrawlPress, my plugin. It checks every day, shows which AI crawlers visit your site and writes your llms.txt."
- slug: llms-txt-generator
  order: 3
  name: "llms.txt generator"
  title: "Free llms.txt Generator: Build the File AI Assistants Read"
  description: "Free llms.txt generator. Enter your website and get a ready-to-upload llms.txt built from your own sitemap, with each page's real title and description."
  summary: "Enter your website and get a ready-to-upload llms.txt built from your own sitemap, using each page's real title and description."
  lead: "An llms.txt file tells AI assistants what your site is about and which pages matter. Enter your website and get one built from your own sitemap, ready to upload."
  sections:
    - id: what
      heading: "What this does"
      paragraphs:
        - "The tool finds your sitemap, picks your main pages, reads each page's title and description, and writes them into the llms.txt format: your site name, a one-line summary, and a list of links."
        - "Everything in the file comes from your own pages. If a page cannot be read, it is left out, and the tool tells you how many. If your home page has no description, the summary line is left out rather than invented."
    - id: how
      heading: "How to use it"
      paragraphs:
        - "**1. Enter your website.** The tool needs a sitemap, usually at /sitemap.xml."
        - "**2. Read the result.** It lists up to 20 pages, the ones closest to your home page first. Remove any you do not want and fix any title that reads badly."
        - "**3. Upload it.** Save the text as llms.txt and put it at the top of your site, so it opens at yoursite.com/llms.txt. On WordPress, your host's file manager or an SFTP client will do."
        - "**4. Check it.** Open the address in your browser, then run the [AI crawler access check](/tools/ai-crawler-access-check/) to see that crawlers can reach it."
    - id: why
      heading: "Why it matters"
      paragraphs:
        - "AI assistants cannot read every page of your site every time someone asks. llms.txt is a short map that points them to what you want them to know. It is a proposal that many sites now follow, not a guarantee that any assistant uses it."
        - "If you want me to write and maintain it with you, [book a call](/consulting/#contact)."
  faq:
    - q: "What is llms.txt?"
      a: "A plain text file at the top of your site, written in a simple format, that gives AI assistants a short summary of your site and links to your key pages."
    - q: "Is this really free?"
      a: "Yes. There is no sign-up and nothing to pay. To stop abuse, each visitor gets a few runs an hour."
    - q: "Do you keep my website address or the file?"
      a: "No. The address is used to build the file and is not saved."
    - q: "Why only 20 pages?"
      a: "A short, clear list works better than a long one. The tool picks the pages closest to your home page. You can add more by hand."
    - q: "It says it could not find a sitemap. What now?"
      a: "The tool looks in your robots.txt and at /sitemap.xml. Add a sitemap, which most WordPress SEO plugins can create, then try again."
    - q: "Will an AI assistant use my llms.txt?"
      a: "Some may, some do not yet. It costs nothing and it keeps your own description of your site in plain view."
    - q: "Is there a WordPress plugin that does this automatically?"
      a: "Yes, CrawlPress, my plugin. It writes your llms.txt and keeps it current."
- slug: does-ai-know-your-business
  order: 1
  name: "Does AI know your business?"
  title: "Free Check: Does ChatGPT, Perplexity or Google AI Recommend Your Business?"
  description: "Free check: enter your business, service and city. We ask ChatGPT, Perplexity and Google AI who to hire there, and show whether you are named, who is named instead, and what to fix."
  summary: "Enter your business, service and city. We ask ChatGPT, Perplexity and Google AI who to hire, then show whether you are named and who is named instead."
  lead: "More people now ask an AI assistant who to hire. Enter your business, your service and your city. We ask ChatGPT, Perplexity and Google AI the same question a customer would, and show you what they say."
  sections:
    - id: what
      heading: "What this does"
      paragraphs:
        - "We ask each assistant, with its web search turned on: \"Who are the best [your service] businesses in [your city]?\" Your business name is not in the question, so the answer is not nudged toward you."
        - "Each assistant also ends its answer with a short list of the business names it recommends. We check that list for your business, using your whole name, and show who is on it instead. The answers are the assistants' own, shown as they came back. If an assistant cannot answer, or gives no clear list, the tool says so."
    - id: how
      heading: "How to read the result"
      paragraphs:
        - "**Named** means your full business name is on that assistant's list. **Not named** means it is not, this time. **Can't tell** means the assistant gave no clear list, so we do not guess. Assistants can answer differently from one run to the next, so one result is a snapshot, not a ranking."
        - "A name close to yours in the list may be you under a slightly different name. Check the list."
        - "Being named is not luck. Assistants quote businesses with a clear website, consistent details across the web, and good reviews."
    - id: fix
      heading: "What to fix if you are not named"
      paragraphs:
        - "**1. Say clearly what you do and where.** Put your service and city on your home page and a page for each service. The [local business schema generator](/tools/local-business-schema-generator/) writes the code that spells it out."
        - "**2. Let the crawlers in.** Run the [AI crawler access check](/tools/ai-crawler-access-check/) to see that ChatGPT, Claude and Perplexity are allowed to read your site."
        - "**3. Add an llms.txt.** The [llms.txt generator](/tools/llms-txt-generator/) builds one."
        - "**4. Keep your listings and reviews consistent.** Your name, address and phone should read the same everywhere."
        - "If you want me to do this with you, [book a call](/consulting/#contact)."
  faq:
    - q: "Is this really free?"
      a: "Yes. There is no sign-up and nothing to pay. Each check uses real AI queries, so each visitor gets a few an hour and there is a daily limit."
    - q: "Is this what customers really see?"
      a: "It is close. We ask the assistants through their developer connections with web search on. The app a customer uses can answer a little differently, and so can the same assistant a minute later."
    - q: "Do you keep what I enter?"
      a: "No. Your business, service and city are used for the check and are not saved. The service and city are sent to the AI companies as part of the question. Your business name is not."
    - q: "Why am I not named when I am a good business?"
      a: "Assistants name businesses they can find clear, consistent information about. Being good is not enough if the web does not say so. The steps above are where to start."
    - q: "Why was a business I know missing from the list?"
      a: "Each assistant names about five. It is a short list, and it changes from run to run."
    - q: "Why does it say \"Can't tell\"?"
      a: "Each assistant is asked to end with a list of business names. Sometimes one does not, and then we do not search its prose and guess. Read its full answer to see for yourself."
    - q: "Why does it say my business name is too general?"
      a: "A name that is only your service, your city or a word like LLC, for example \"Plumbing\" or \"St. George Utah\", would match any competitor. Enter your full, distinctive name, such as \"Red Rock Plumbing\"."
    - q: "Can you make AI recommend me?"
      a: "Nobody can promise that. I can make your business easy to find, read and trust, which is what moves the odds."
- slug: neighborhood-page-planner
  order: 5
  name: "Neighborhood page planner"
  title: "Free Neighborhood Page Planner: Which Local Pages to Build First"
  description: "Free neighborhood page planner. Enter a city and see its mapped neighborhoods with the age of the homes, the number of homes and the median home value from public Census data, ranked by where older homes cluster."
  summary: "Enter a city and see its neighborhoods with home age, home counts and values from public Census data, ranked to show which local pages to build first."
  lead: "Local pages win when they speak to a real neighborhood. Enter a city and see its neighborhoods with the age of the homes around them, from public Census data, and which to build pages for first."
  sections:
    - id: what
      heading: "What this does"
      paragraphs:
        - "The tool asks OpenStreetMap for the named neighborhoods mapped inside your city, finds the Census tract each one sits in, and reads that tract's median year homes were built, number of homes and median home value from the American Community Survey."
        - "It then ranks the neighborhoods by homes times the age of those homes. It is a way to order the list, not a measurement. More homes and older homes both push a neighborhood up, which suits services like roofing, plumbing, heating and garage doors."
    - id: how
      heading: "How to read it"
      paragraphs:
        - "**The Census figures describe the tract, not the neighborhood.** A tract can hold several neighborhoods, and they will share its numbers. Treat them as the area around the neighborhood."
        - "**The list is only as complete as the map.** If a neighborhood you know is missing, it has not been mapped yet. The tool lists what exists and does not guess."
        - "A neighborhood with no Census figures is shown with dashes. It is never filled in."
    - id: build
      heading: "How to use the list"
      paragraphs:
        - "Start with the top five. For each, build a page that names the neighborhood, the services you offer there, the age of its homes and the jobs you have done nearby. Real details beat generic text."
        - "The [local business schema generator](/tools/local-business-schema-generator/) writes the code that tells search engines which areas you serve. If you want me to research and build these pages with you, [book a call](/consulting/#contact)."
  faq:
    - q: "Is this really free?"
      a: "Yes. There is no sign-up and nothing to pay. Each visitor gets a few lookups an hour."
    - q: "Where does the data come from?"
      a: "Neighborhood names and places come from OpenStreetMap contributors, asked straight from your browser. Home age, home counts and values come from the American Community Survey, five-year estimates, from the US Census Bureau."
    - q: "Why is it slow the first time?"
      a: "The public map service can take up to a minute, and your browser asks it directly. After the first lookup for a city, your browser keeps the list for a week, so the next one is quick."
    - q: "Why are some neighborhoods missing?"
      a: "Only neighborhoods that someone has mapped appear. Local mappers add them over time."
    - q: "Why do two neighborhoods show the same numbers?"
      a: "They sit in the same Census tract. The Census does not publish figures for a single neighborhood."
    - q: "Does this cover cities outside the United States?"
      a: "No. It uses US Census data."
    - q: "Can you build the pages for me?"
      a: "Yes. That is part of my local SEO work. Book a call and tell me your city and services."
- slug: local-seo-quick-audit
  order: 4
  name: "Local SEO quick audit"
  title: "Free Local SEO Quick Audit: Your Google Profile, Reviews and Neighborhood Pages"
  description: "Free local SEO quick audit. Enter your business, service and city: see your Google Maps listing, how your review count compares with nearby competitors, and which neighborhoods have a page on your site."
  summary: "Enter your business, service and city to see your Google listing, how your reviews compare with nearby competitors, and which neighborhoods have a page on your site."
  lead: "Three things decide whether local customers find you: your Google listing, your reviews next to the competition, and pages that speak to the neighborhoods you serve. Enter your business and see where you stand on each."
  sections:
    - id: what
      heading: "What this checks"
      paragraphs:
        - "**Your Google listing.** Whether Google Maps shows a listing under your exact name, with its star rating, review count, address, phone, website and hours."
        - "**Your reviews against nearby competitors.** The review counts and ratings of other businesses offering your service in your city, from Google Maps, and where you rank among them."
        - "**Neighborhood pages.** If you give your website, the tool reads its sitemap and checks which of your city's neighborhoods have a page whose address names them. This is the method I use for local service companies: one useful page for each neighborhood you serve."
    - id: how
      heading: "How to read it"
      paragraphs:
        - "**The figures come from Google Maps**, read for you through Gemini, Google's AI. Every listing links to its Google Maps page so you can check the numbers. A listing is shown only if Google Maps returned it, and your own listing counts only when the name matches yours exactly. A similar name is shown as a different business."
        - "**The competitor list is a sample**, up to eight businesses, not every one in town. It changes a little from run to run."
        - "**A neighborhood counts as covered** when its name appears in the address of a page in your sitemap, such as /plumber-coral-canyon/. A page that covers a neighborhood under another address will show as missing. The page checks your sitemap, not the words on each page."
    - id: fix
      heading: "What to do with it"
      paragraphs:
        - "**No listing found?** Claim or create your Google Business Profile first. Nothing else matters as much."
        - "**Fewer reviews than the competition?** Ask every happy customer, the same day you finish the job, with a direct link to your review page."
        - "**Missing neighborhood pages?** Start with the neighborhoods with the oldest homes and the most of them. The [neighborhood page planner](/tools/neighborhood-page-planner/) ranks them for you from public Census data."
        - "If you want me to do this with you, [book a call](/consulting/#contact)."
  faq:
    - q: "Is this really free?"
      a: "Yes. There is no sign-up and nothing to pay. Each check reads Google Maps, so each visitor gets a few an hour and there is a daily limit."
    - q: "Where do the numbers come from?"
      a: "From Google Maps, through Gemini, Google's AI assistant, which reads the listing for us. Each business links to its Google Maps page, so you can check any figure yourself."
    - q: "Why does it say it could not find my listing?"
      a: "Google Maps did not return a listing with exactly your name in your city. Try your name as it appears on Google, or the listing may not exist yet. A listing with a similar name is shown separately as a different business."
    - q: "Is the competitor list complete?"
      a: "No. It is up to eight businesses Google Maps returns for your service and city, and it can change from run to run."
    - q: "Do you keep what I enter?"
      a: "No. Your business, service, city and website are used for the check and are not saved. The service and city, and your business name, are sent to Google to look up the listing."
    - q: "My site has a neighborhood page but it shows as missing. Why?"
      a: "The tool matches the neighborhood's name to the address of pages in your sitemap. A page at an address that does not include the neighborhood's name will not be found. It also cannot see pages that are not in your sitemap."
    - q: "Can you build the neighborhood pages for me?"
      a: "Yes. That is part of my local SEO work. Book a call and tell me your city and services."
