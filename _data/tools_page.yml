title: "Free Tools for Small Businesses"
description: "Free tools for small business owners: see how AI and search find you, and fix what they miss. Schema generator, AI crawler check, llms.txt builder and more."
lead: "Small tools I built for my own clients, free for you. Each one answers one question about how search and AI assistants see your business."
faq:
  - q: "Are these tools really free?"
    a: "Yes. There is no sign-up and no card. If a tool needs more than a few minutes of my time to act on, you can book a call."
  - q: "Do you keep what I type in?"
    a: "The tools that run in your browser never send what you type anywhere. The ones that look at a website or ask an AI assistant send only the business or address you enter, and I do not save it."
  - q: "What if a tool cannot find an answer?"
    a: "It says so. I would rather show you a blank than a made-up number."
  - q: "What is CrawlPress?"
    a: "CrawlPress is my WordPress plugin. It shows which AI crawlers visit your site, scores how ready your site is for AI search, and writes your llms.txt file for you."
  - q: "Can you fix what a tool finds?"
    a: "Yes. That is what my monthly plans are for. Book a call and tell me what the tool showed you."
