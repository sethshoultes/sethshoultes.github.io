# Games on /projects/. One entry per game; the page, the markdown twin and the VideoGame JSON-LD all read this file.
# rank orders everything: the Play something row is the first `featured_count` games by rank, and the Arcade grid is every game by rank. Reorder with one edit.
# image_source is the Arcade card image each local WebP (640x264) was made from. play is the live game; page is its Arcade listing.

featured_count: 6
arcade_top: 4 # the best games sit in a plain top row of the Arcade grid; the rest pack as masonry

arcade:
  url: https://arcade.adventurebuildr.com/
  name: The AdventureBuildr Arcade
  line: "Thirteen browser games in one place: action, adventure, simulation, strategy, tabletop and word games."

genres:
  - {id: action, name: "Action"}
  - {id: adventure, name: "Adventure"}
  - {id: simulation, name: "Simulation"}
  - {id: strategy, name: "Strategy"}
  - {id: tabletop, name: "Tabletop"}
  - {id: word, name: "Word and typing"}

