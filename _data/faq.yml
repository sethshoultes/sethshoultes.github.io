- q: "What does an AI consultant do for a small business?"
  a: "I work alongside you every month to find where AI saves you hours and wins you customers, then I build it and keep it running. You get a plan you can follow, and tools that work on your real business."
- q: "How much does AI consulting cost?"
  a: "Monthly plans are $1,500 (Advisor), $4,000 (Fractional AI Lead) and $8,000 (Embedded AI Team). You can also start with a single project: a $2,500 AI Audit or a $1,500 Team Workshop. Every monthly plan can be cancelled any month."
- q: "Do I need a technical team to work with you?"
  a: "No. I build and run the tools for you and train your people on them. That's included on the Fractional AI Lead and Embedded AI Team plans."
- q: "Where do I start if I'm not sure what AI could do for my business?"
  a: "Book a call and tell me about your business. If you want a written plan first, the AI Audit is two weeks of looking at how your business runs, ending in a list of where AI pays off first."
- q: "Who am I, and why should you trust me with this?"
  a: "I'm Seth Shoultes. I've been building websites and running businesses for over 25 years. I co-founded Event Espresso, a WordPress plugin that won the Utah Entrepreneur Challenge in 2011, and I've organized WordPress meetups for over 15 years."
- q: "Is there a community I can join?"
  a: "Yes. I host a monthly meetup for AI and WordPress. Business leaders, their teams and people from the local community come, and every consulting plan includes it for you and your employees."
