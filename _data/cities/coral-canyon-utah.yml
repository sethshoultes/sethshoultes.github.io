sections:
  - id: services
    heading: "What I do for Coral Canyon businesses"
    paragraphs:
      - "Coral Canyon has new homes and new businesses, and many of the people who live here are new to the neighborhood. I help the businesses around them be found."
      - "**New neighbors.** A new homeowner does not have a go-to plumber, painter or landscaper yet. They search, and a clear page about your service and your area is what they find."
      - "**Golf and visitors.** The public course and its clubhouse restaurant can bring people who are not local. I build pages and answers for the questions visitors ask before they arrive."
      - "**Businesses along the corridor.** Coral Canyon sits on the I-15 corridor between St. George and Hurricane. Businesses here serve both, and need pages that say so."
      - "I offer AI services with SEO built in, plus content generation, media production and interactive website development."
  - id: numbers
    heading: "Coral Canyon by the numbers"
    paragraphs:
      - "The City of St. George describes Coral Canyon as one of the largest and most established master-planned golf communities in Washington County. It covers about 2,600 acres with roughly 1,338 homes, where the original agreement called for about 2,000."
      - "It is not gated and is open to all ages. The clubhouse has indoor and outdoor pools, a fitness center, pickleball and tennis. Coral Canyon is about ten minutes from central St. George and about 45 minutes from Zion National Park."
