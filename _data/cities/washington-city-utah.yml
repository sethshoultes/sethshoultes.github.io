sections:
  - id: services
    heading: "What I do for Washington City businesses"
    paragraphs:
      - "I offer AI services that come with SEO built in. That means the work you pay me for is made to be found, not just made."
      - "**Content generation.** Pages, posts and answers written in your voice, about your town and your customers, so people searching in Washington City find you first."
      - "**Media production.** Images and video for your site and your listings, made so they load fast and say what you do."
      - "**Interactive website development.** Sites and tools that do something: a quote tool, a booking flow, a page that answers the questions your customers keep asking."
      - "Every one of these starts with the same question: who is searching, what are they typing, and what do they need to see to call you?"
  - id: seo
    heading: "Nearly twenty years of SEO"
    paragraphs:
      - "I have worked on search for almost 20 years, for companies and for services. I owned a website development agency, I worked inside a marketing department, and I ran SEO for Espresso."
      - "So when I say a page will be found, I am not guessing. I have done this work for companies, for services and for my own business."
  - id: proof
    heading: "What I did for a Southern Utah garage door company"
    paragraphs:
      - "I bought Garage Door Pro Services in Southern Utah and took it to number one within the first three months."
      - "I grew its reviews. I built neighborhood locality pages and a checklist. Once the company was outranking everyone else, I sold it to a competitor."
      - "That is the same playbook I bring to a local business in Washington City: be the one customers in your neighborhood see first, and give them every reason to trust you."
  - id: numbers
    heading: "Washington City, by the numbers"
    paragraphs:
      - "Washington City is a young, busy place. The Census Bureau's 2019 to 2023 American Community Survey, as reported by Point2Homes, counts about 32,300 people and about 13,750 homes. About three in four households own their home, and roughly 72 percent of homes were built in 2000 or later."
      - "Many people here are new to town, and new neighbors search for a plumber, a dentist or a landscaper. The business that shows up with a clear page and good reviews is the one they call."
