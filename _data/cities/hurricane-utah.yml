sections:
  - id: services
    heading: "What I do for Hurricane businesses"
    paragraphs:
      - "I offer AI services that come with SEO built in, plus content generation, media production and interactive website development."
      - "**Growth.** Hurricane had 20,036 people at the 2020 census, up almost 46 percent in ten years. A fast-growing city fills with new households that do not yet know who to call. I build pages that answer them first."
      - "**Outdoor visitors.** With two state park reservoirs, a river park and a mountain bike festival, people come here to play. Visitors search before they travel, and your pages and answers can be there when they do."
      - "**Distribution and trades.** Several distribution centers have set up here, and growth brings steady work for trades and services. I help them show up for the jobs they want."
  - id: numbers
    heading: "Hurricane by the numbers"
    paragraphs:
      - "Hurricane's population grew from 13,748 in 2010 to 20,036 in 2020. It is the kind of growth that changes who is searching for your business, and what they type."
  - id: track
    heading: "My track record"
    paragraphs:
      - "I have worked on search for almost 20 years, and I took a Southern Utah garage door company to number one within the first three months. The story is on my [SEO services page](/seo-services/)."
