sections:
  - id: services
    heading: "What I do for Hurricane businesses"
    paragraphs:
      - "Hurricane is changing fast, and the businesses that grow with it are the ones people find first. That is what I help with: AI and SEO together."
      - "**Growth.** Hurricane had 20,036 people at the 2020 census, up almost 46 percent in ten years. A fast-growing city fills with new households that do not yet know who to call. I build pages that answer them first."
      - "**Outdoor visitors.** With two state park reservoirs, a river park and a mountain bike festival, people come here to play. Visitors often search before they go, and your pages and answers can be there when they do."
      - "**Distribution and trades.** Several distribution centers have set up here. I help the businesses around them show up for the jobs they want."
  - id: numbers
    heading: "Hurricane by the numbers"
    paragraphs:
      - "Hurricane's population grew from 13,748 in 2010 to 20,036 in 2020. It is the kind of growth that changes who is searching for your business, and what they type."
