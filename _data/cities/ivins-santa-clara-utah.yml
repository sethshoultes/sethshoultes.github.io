sections:
  - id: services
    heading: "What I do for Ivins and Santa Clara businesses"
    paragraphs:
      - "Two small cities, one big neighbor: that is the setting I build for, with AI and SEO together so a local business can be found without a big budget."
      - "**Resorts and visitors.** Ivins has several resorts, including Red Mountain, Movara, Sentierre and Black Desert, and a PGA Tour event at Black Desert since 2024. Guests look for places to eat, shop and play, and I help local businesses be found when they do."
      - "**Arts and events.** Tuacahn and the Kayenta Art Village bring audiences who plan a visit around a show. I build pages and answers for the questions those visitors ask."
      - "**Neighborhood services.** Both towns are part of the St. George metro area. A plumber, a dentist or a landscaper here is one of many in the St. George area, so a clear page about your own neighborhood matters."
  - id: numbers
    heading: "Ivins and Santa Clara by the numbers"
    paragraphs:
      - "Ivins had 8,978 people at the 2020 census, up from 6,753 in 2010. Santa Clara had 7,553, up from 6,003. Together they are about 16,500 people, in two small cities next to a much bigger one."
