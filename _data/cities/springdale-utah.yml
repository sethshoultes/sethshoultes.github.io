  - id: services
    heading: "What I do for Springdale and Zion businesses"
    paragraphs:
      - "I offer AI services that come with SEO built in, plus content generation, media production and interactive website development."
      - "**Your customers are not local.** Many of the people who find a Springdale business are planning a trip from somewhere else. They search for where to sleep, eat and book a guide before they arrive."
      - "**Answers they can quote.** Some visitors ask an AI assistant for a plan. I build pages that give clear, accurate answers about your business, so assistants can quote you. See [AI search optimization](/ai-search-optimization/)."
      - "**I know the canyon.** I am an avid hiker and I hike in Zion a lot, so I understand what visitors want to know before they go."
