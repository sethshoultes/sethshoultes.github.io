faq:
  - q: "What can you do for my Springdale or Zion-area business?"
    a: "Help it be found by people planning a trip, with pages, answers and tools built for them. We start with a call about your business."
  - q: "Are you based in Springdale?"
    a: "No. I live down the river in Washington City and I hike in Zion a lot. I work with businesses around Southern Utah."
  - q: "Can you help a business that serves park visitors?"
    a: "Yes. Tell me who your visitors are and when they decide. I will build pages and answers for the questions they ask before they arrive."
  - q: "How do we get started?"
    a: "Book a call on my consulting page and tell me about your business. I reply within two business days."
