    cta_href: "/consulting/#contact"
  - eyebrow: "The town"
    heading: "Settled in 1862, set in Zion Canyon."
    body: "Springdale began as a farming community. Mount Kinesava stands to the west and The Watchman to the east, and the North Fork of the Virgin River runs through town."
  - eyebrow: "The gateway"
    heading: "Next door to a national park."
    body: "Springdale sits right beside the boundary of Zion National Park, and is called a gateway community. About 500 people live here."
