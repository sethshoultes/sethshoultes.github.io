sections:
  - id: services
    heading: "What I do for Springdale and Zion businesses"
    paragraphs:
      - "Springdale is a very small town with a very large audience, and most of it finds you on a screen first. I help businesses here be found, with AI and SEO built into the work."
      - "**Many of your customers are not local.** They are planning a trip from somewhere else. They search for where to sleep, eat and book a guide before they arrive."
      - "**Answers they can quote.** I build pages that give clear, accurate answers about your business, so search and AI assistants can quote you. See [AI search optimization](/ai-search-optimization/)."
      - "**I know the canyon.** I am an avid hiker, and I hike in Zion a lot."
  - id: numbers
    heading: "Springdale by the numbers"
    paragraphs:
      - "Springdale had 514 residents at the 2020 census. That makes being found online matter a great deal."
