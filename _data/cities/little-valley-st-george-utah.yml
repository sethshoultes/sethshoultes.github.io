sections:
  - id: services
    heading: "What I do for Little Valley businesses"
    paragraphs:
      - "Little Valley is a neighborhood of St. George, so the people who search for your business are St. George residents, and people who are in town for something else. I help you be found by both, with AI and SEO built into the work."
      - "**For businesses that serve the neighborhood.** A page about your service and your part of St. George, written for someone who lives nearby and searches on their phone."
      - "**For businesses near the fields.** When a park hosts tournaments, families look for food, a place to stay and something to do between games. My reasoning, not a statistic: those searches happen before the trip, so I build pages and answers a visitor, or an AI assistant, can find and quote."
  - id: numbers
    heading: "Little Valley, from the city's own pages"
    paragraphs:
      - "These are facts from the City of St. George and the Washington County School District, not estimates. I have no neighborhood-level census figures, so I do not quote any."
