faq:
  - q: "What can you do for my Little Valley business?"
    a: "Help it be found by neighbors and by visitors, with pages, answers and tools built for your customers. We start with a call about your business and where your customers come from."
  - q: "Is Little Valley its own city?"
    a: "No. It is a neighborhood inside the city of St. George. My pages for St. George and for Little Valley work together."
  - q: "Are you based in Little Valley?"
    a: "No. I live in Washington City, along the Virgin River, and I work with businesses around Southern Utah."
  - q: "How do we get started?"
    a: "Book a call on my consulting page and tell me about your business. I reply within two business days."
