sections:
  - id: services
    heading: "What I do for Cedar City businesses"
    paragraphs:
      - "Cedar City runs on a university, a festival and the road to the parks. I help businesses here be found by all three, with AI and SEO built into the work."
      - "**A university town.** Southern Utah University is the city's largest employer. Students, staff and families search for places to eat, rent, shop and get help, and I help local businesses be found by them."
      - "**Festival and park visitors.** The Utah Shakespeare Festival and the nearby parks bring visitors who plan ahead. A restaurant, a shop or a lodging business here wins or loses on whether it shows up when they search."
      - "**Local trades and manufacturing.** Cedar City also has a small manufacturing base and steady home construction. I help trades and service companies be the clear answer for their own area."
  - id: numbers
    heading: "Cedar City by the numbers"
    paragraphs:
      - "Cedar City had 35,235 people at the 2020 census, up from 28,857 in 2010. Its largest employers are Southern Utah University, the Iron County School District and Intermountain Health."
