  - q: "Are you based in St. George?"
    a: "I live next door in Washington City, along the Virgin River, and I work with businesses around Southern Utah."
  - q: "Can you help a business that serves tourists?"
    a: "Yes. Races, golf and the nearby parks bring people who search before they come. I build pages and answers for what they ask before they arrive."
  - q: "How do we get started?"
    a: "Book a call on my consulting page and tell me about your business. I reply within two business days."
