sections:
  - id: services
    heading: "What I do for St. George businesses"
    paragraphs:
      - "In a city this size, being found means standing out in a crowded set of results. That is the work I do: AI and SEO together, so what I build for you is made to be found."
      - "**For businesses that serve neighbors.** St. George is growing fast, with new homes and new households arriving all the time. I build pages about your service and your area that a new resident can find on day one."
      - "**For businesses that serve visitors.** Tourism is a large part of the local economy, with golf, parks and races drawing people from out of town. Visitors search before they travel. I work to make your business show up when they do, with clear pages and answers that AI assistants can quote."
      - "**For businesses that sit between the two.** Restaurants, shops and services that serve both groups need pages for each."
  - id: numbers
    heading: "St. George by the numbers"
    paragraphs:
      - "St. George had 95,342 people at the 2020 census, and an estimate of 106,288 for 2024. Its economy leans on tourism, manufacturing and new-home construction. It has a university, a regional airport and the only 24-hour trauma center between Las Vegas and the Wasatch Front."
      - "That mix of residents, students and visitors means your customers search in different ways. One page rarely serves them all."
