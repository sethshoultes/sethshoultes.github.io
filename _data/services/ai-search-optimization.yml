title: "AI Search Optimization: Get Found in ChatGPT, Google AI Overviews and Perplexity"
description: "AI search optimization (GEO) for Southern Utah businesses: help your business show up when people ask ChatGPT, Google AI Overviews and Perplexity."
service_type: "AI search optimization (GEO)"
summary: "Help your business show up in AI answers: ChatGPT, Google AI Overviews and Perplexity."
lead: "More people now ask an AI assistant first. I help your business show up in the answers."
sections:
  - id: what
    heading: "What AI search optimization is"
    paragraphs:
      - "When someone asks ChatGPT, Google's AI Overviews or Perplexity a question, the assistant quotes a few sources. AI search optimization, sometimes called GEO, is making your pages the kind of source an assistant can find, trust and quote."
      - "I build on nearly 20 years of SEO. The foundation is the same: clear, accurate pages that answer a real question."
  - id: do
    heading: "What I do"
    paragraphs:
      - "**Pages made to be quoted.** Plain answers to the questions your customers ask, in your voice."
      - "**Structured data.** Markup that tells search engines and assistants who you are, what you offer and where."
      - "**Plain-text versions and an llms.txt file.** I publish these on my own site, so I know what it takes. See [my llms.txt](/llms.txt)."
  - id: proof
    heading: "What I have seen"
    paragraphs:
      - "Garage Door Science, a guide site I built, is gaining ground in search and appearing in AI answers."
      - "Before that, I took Garage Door Pro Services in Southern Utah to number one within the first three months. I treat search and AI answers as one job."
  - id: start
    heading: "How we start"
    paragraphs:
      - "We start with a call about your business. I look at how you show up today and tell you plainly what I would change first."
faq:
  - q: "What is GEO, or AI search optimization?"
    a: "It is making your pages easy for AI assistants such as ChatGPT, Google AI Overviews and Perplexity to find and quote when people ask questions about what you sell."
  - q: "Can you guarantee ChatGPT will mention my business?"
    a: "No. No one can, and anyone who promises it is guessing. I can make your pages clear, accurate and easy to quote, and tell you what I see."
  - q: "Does this replace SEO?"
    a: "No. I treat them as one job: I build pages around a real question, for search results and AI answers together."
  - q: "Do you work outside Southern Utah?"
    a: "Yes. Southern Utah is home, and my monthly plans work from anywhere."
