free:
  heading: "What stays free"
  text: "Every tool on the [free tools page](/tools/) works without paying or signing up, and the CrawlPress plugin has a free version. The subscription adds to them. It does not take anything away."
how:
  heading: "How you get access"
  paragraphs:
    - "Pay with the Stripe link. Use the email address of the Google account you will sign in with, because access is tied to that email."
    - "CrawlPress Pro turns on by itself within a few minutes of your payment. Sign in to CrawlPress with Google, using the email you paid with, add your site, and it is Pro. The other parts of Seth's Apps are still being built, and I will email you when each one is ready."
    - "Apps that have a sign-in use Google sign-in. I only receive your email address and Google account ID."
faq:
  - q: "What do I get with Seth's Apps?"
    a: "CrawlPress Pro for one WordPress site today. The premium side of the free tools (a higher daily limit, saved reports and weekly AI visibility monitoring for one business) is being built, and each new app I launch joins the subscription. The page marks which is which."
  - q: "Is there a free trial?"
    a: "Yes, 14 days on Seth's Apps, monthly or yearly. The CrawlPress Pro and monitoring links on their own have no trial."
  - q: "How much does it cost?"
    a: "Seth's Apps is $19 a month or $190 a year. CrawlPress Pro alone is $9 a month for each site. AI visibility monitoring alone is $7 a month for each business."
  - q: "How soon do I get access?"
    a: "CrawlPress Pro turns on by itself within a few minutes of your payment, for the site you add under the email you paid with. If it has not turned on after an hour, email me and I will fix it by hand. The premium parts of the free tools are still being built."
  - q: "How do I cancel?"
    a: "Stripe sends a receipt with a link to manage or cancel your subscription. Cancel any time and you keep access until the end of what you paid for."
  - q: "Do the free tools stay free?"
    a: "Yes. Every tool on the free tools page stays free. The subscription adds to them."
  - q: "Will you work on my site for me?"
    a: "That is a different thing. My monthly consulting plans put me or my AI agent team on your business. Book a call to talk about it."
